    return String(state.data.householdAdults) === '1' || state.data.familyForm === 'Single-parent household';
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const el = document.getElementById('save-indicator');
        if (el) el.textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
        const el = document.getElementById('save-indicator');
        if (el) el.textContent = 'Use Save JSON backup';
    }
    updateTopHUD();
}

function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function money(val) {
    const n = Number(val) || 0;
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
}

function showToast(msg) {
    const el = document.getElementById('toast-banner');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.add('hidden'), 4200);
}

function calcTotals() {
    const d = state.data;
    const grossA = Number(d.incomeA) || 0;
    const grossB = isSingleParent() ? 0 : (Number(d.incomeB) || 0);
    const gross = grossA + grossB;
    const net = gross - (Number(d.deductions) || 0);
    const spend = state.expenses.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    return { gross, net, spend, balance: net - spend };
}

function calcHoursLeft(suffix) {
    const d = state.data;
    const used = ['paid', 'study', 'care', 'commute', 'other'].reduce((sum, k) => sum + (Number(d[k + suffix]) || 0), 0);
    return 168 - 56 - used;
}

function updateTopHUD() {
    const famEl = document.getElementById('hud-family-name');
    if (famEl) famEl.textContent = state.data.familyName || 'Unnamed Household';

    const camBtn2 = document.getElementById('cam-btn-adult2');
    if (camBtn2) camBtn2.style.display = isSingleParent() ? 'none' : 'inline-block';

    const t = calcTotals();
    const balEl = document.getElementById('hud-balance');
    if (balEl) {
        balEl.textContent = money(t.balance);
        balEl.className = 'text-sm font-mono ' + (t.balance < 0 ? 'text-rose-400' : 'text-emerald-400');
    }

    const hrsEl = document.getElementById('hud-hours');
    if (hrsEl) {
        const hA = calcHoursLeft('A');
        if (isSingleParent()) {
            hrsEl.textContent = `${hA}h free (1 Adult)`;
            hrsEl.className = 'text-sm font-mono ' + (hA < 0 ? 'text-rose-400' : 'text-sky-300');
        } else {
            const hB = calcHoursLeft('B');
            hrsEl.textContent = `${hA}h / ${hB}h`;
            hrsEl.className = 'text-sm font-mono ' + ((hA < 0 || hB < 0) ? 'text-rose-400' : 'text-sky-300');
        }
    }
}

    const container = document.getElementById('three-container');

function createNameplateSprite(nameText, roleText) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 140;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = 'rgba(15, 23, 42, 0.86)';
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.75)';
    ctx.lineWidth = 4;
    const r = 24;
    ctx.beginPath();
    ctx.moveTo(20 + r, 15);
    ctx.lineTo(492 - r, 15);
    ctx.quadraticCurveTo(492, 15, 492, 15 + r);
    ctx.lineTo(492, 125 - r);
    ctx.quadraticCurveTo(492, 125, 492 - r, 125);
    ctx.lineTo(20 + r, 125);
    ctx.quadraticCurveTo(20, 125, 20, 125 - r);
    ctx.lineTo(20, 15 + r);
    ctx.quadraticCurveTo(20, 15, 20 + r, 15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(nameText || 'Member').slice(0, 22), 256, 66);

    ctx.fillStyle = '#5eead4';
    ctx.font = '600 24px Inter, sans-serif';
    ctx.fillText(String(roleText || '').slice(0, 30), 256, 104);

    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(1.65, 0.45, 1);
    return sprite;
}

function rebuild3DFamily() {
    if (!familyGroup) return;
    while (familyGroup.children.length > 0) {
        familyGroup.remove(familyGroup.children[0]);
    }
    characterRigs = [];

    const single = isSingleParent();
    const positions = single
        ? [
            { x: -0.75, z: 0.20, rotY: 0.18 },
            { x: 0,     z: 0,    rotY: 0 },
            { x: 0.75,  z: 0.45, rotY: -0.22 }
        ]
        : [
            { x: -1.45, z: 0.25, rotY: 0.22 },
            { x: 0.05,  z: 0.05, rotY: -0.10 },
            { x: 1.35,  z: 0.55, rotY: -0.32 }
        ];

    state.avatars.forEach((av, idx) => {
        if (single && idx === 1) {
            characterRigs.push(null);
            return;
        }
        const rig = buildHumanoidCharacter(av, idx);
        rig.root.position.set(positions[idx].x, 0, positions[idx].z);
        rig.root.rotation.y = positions[idx].rotY;
        familyGroup.add(rig.root);
        characterRigs.push(rig);
    });
}

window.setCameraFocus = function(target) {
    if (target === 'all') {
        cameraTargetGoal.set(0, 1.25, 0);
        cameraPosGoal = new THREE.Vector3(0, 3.2, 6.8);
    } else if (typeof target === 'number' && characterRigs[target]) {
        const pos = characterRigs[target].root.position;
        const yFocus = target === 2 ? 1.05 : 1.55;
        cameraTargetGoal.set(pos.x, yFocus, pos.z);
        cameraPosGoal = new THREE.Vector3(pos.x, yFocus + 0.55, pos.z + 3.1);
    }
};

function trigger3DGesture(type, durationMs = 3500) {
    activeGesture = { type, until: performance.now() + durationMs };
}

function updateRoomSceneMood() {
    if (!warningBeaconMesh) return;
    warningBeaconMesh.visible = (state.step === 4);
    const subEl = document.getElementById('hud-scene-subtitle');
    if (subEl) {
        subEl.textContent = CHAPTER_TITLES[state.step] || 'Interactive 3D Family Environment';
    }
    if (state.step === 3) {
        if (characterRigs[0] && characterRigs[1]) {
            characterRigs[0].root.rotation.y = 0.55;
            characterRigs[1].root.rotation.y = -0.55;
        } else if (characterRigs[0] && characterRigs[2]) {
            characterRigs[0].root.rotation.y = 0.45;
            characterRigs[2].root.rotation.y = -0.45;
        }
    } else {
        if (characterRigs[0]) characterRigs[0].root.rotation.y = isSingleParent() ? 0.18 : 0.22;
        if (characterRigs[1]) characterRigs[1].root.rotation.y = -0.10;
    }
}

function animateThree() {
    requestAnimationFrame(animateThree);
    const now = performance.now();
    const t = now * 0.002;

    if (controls) {
        controls.target.lerp(cameraTargetGoal, 0.08);
        if (cameraPosGoal) {
            camera.position.lerp(cameraPosGoal, 0.07);
            if (camera.position.distanceTo(cameraPosGoal) < 0.08) {
                cameraPosGoal = null;
            }
        }
        controls.update();
    }

    const inGesture = now < activeGesture.until;
    characterRigs.forEach((rig, i) => {
        if (!rig) return;
        rig.bodyGroup.position.y = Math.sin(t + i * 1.3) * 0.022;
        rig.headGroup.rotation.y = Math.sin(t * 0.6 + i) * 0.07;
        rig.headGroup.rotation.x = 0;

        if (inGesture && (i === 0 || i === 1)) {
            if (activeGesture.type === 'listen') {
                rig.headGroup.rotation.x = Math.sin(t * 4) * 0.09;
                rig.rightArmPivot.rotation.x = -0.45 + Math.sin(t * 3 + i) * 0.15;
            } else if (activeGesture.type === 'defend') {
                rig.headGroup.rotation.y = Math.sin(t * 6) * 0.18;
                rig.leftArmPivot.rotation.x = -0.6;
                rig.rightArmPivot.rotation.x = -0.6;
            } else if (activeGesture.type === 'pause') {
                rig.rightArmPivot.rotation.x = -0.8;
            }
        } else {
            rig.leftArmPivot.rotation.x = Math.sin(t * 0.8 + i) * 0.05;
            rig.rightArmPivot.rotation.x = -Math.sin(t * 0.8 + i) * 0.05;
        }
    });

    if (warningBeaconMesh && warningBeaconMesh.visible) {
        warningBeaconMesh.rotation.y += 0.04;
        warningBeaconMesh.position.y = 3.35 + Math.sin(t * 2.5) * 0.12;
    }

    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

function countWords(str) {
    const s = String(str || '').trim();
    return s ? s.split(/\s+/).length : 0;
}

function renderField(key, label, opts = {}) {
    const {
        type = 'text',
        min = 0,
        max,
        rows = 3,
        options = null,
        hint = '',
        placeholder = '',
        example = ''
    } = opts;

    const val = state.data[key] ?? '';
    const trimmedLen = String(val).trim().length;
    const words = countWords(val);
    const isMet = trimmedLen >= min;

    let inputHtml = '';
    if (options) {
        inputHtml = `<select data-key="${key}" id="f-${key}" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-600">
            <option value="">Choose option…</option>
            ${options.map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select>`;
    } else if (type === 'textarea') {
        inputHtml = `<textarea data-key="${key}" data-min="${min}" id="f-${key}" rows="${rows}" maxlength="4000" placeholder="${esc(placeholder)}" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-teal-600">${esc(val)}</textarea>`;
    } else {
        inputHtml = `<input data-key="${key}" id="f-${key}" type="${type}" value="${esc(val)}" ${min !== undefined && type === 'number' ? `min="${min}"` : ''} ${max !== undefined ? `max="${max}"` : ''} placeholder="${esc(placeholder)}" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-medium focus:outline-none focus:ring-2 focus:ring-teal-600">`;
    }

    const counterBar = (type === 'textarea' && min > 0)
        ? `<div id="cnt-${key}" class="flex items-center justify-between text-[11px] mt-1 px-1 ${isMet ? 'text-teal-700 font-bold' : 'text-amber-700 font-medium'}">
            <span>Minimum required: ${min} characters</span>
            <span>${trimmedLen} / ${min} chars (${words} words) ${isMet ? '✓ Meets requirement' : '— keep writing'}</span>
           </div>`
        : '';

    const exampleBox = example
        ? `<div class="mt-1.5 bg-teal-50/80 border-l-3 border-teal-600 px-2.5 py-1.5 rounded text-[11px] text-slate-600">
            <strong class="text-teal-900">Example of strong work:</strong> ${example}
           </div>`
        : '';

    return `<div class="space-y-1">
        <label for="f-${key}" class="block text-xs font-bold text-slate-800">${label}</label>
        ${inputHtml}
        ${counterBar}
        ${hint ? `<p class="text-[11px] text-slate-500">${hint}</p>` : ''}
        ${exampleBox}
    </div>`;
}

/**
 * ============================================================================
 * 6. VALIDATION, NAVIGATION & INTERACTION HANDLERS
 * ============================================================================

function validateChapter(stepNum) {
    const d = state.data;
    const errs = [];
    const req = (key, label, min = 1) => {
        if (String(d[key] || '').trim().length < min) errs.push(label);
    };

    if (stepNum === 0) {
        req('learner', 'Enter your name or course alias.', 1);
        if (!d.introRead) errs.push('Check the box acknowledging the transparent assignment guidelines.');
        return errs;
    }

    if (stepNum === 1) {
        const single = isSingleParent();
        req('familyName', 'Enter a household name.', 1);
        req('location', 'Enter a city/location.', 1);
        req('familyForm', 'Select the relationship/household arrangement.', 1);
        req('value', 'Select a guiding family value.', 1);
        req('origin', 'Describe how the family came together (min 20 chars).', 20);
        (single ? ['a', 'c'] : ['a', 'b', 'c']).forEach(p => {
            const label = p === 'c' ? 'the Child' : p === 'a' ? 'Adult 1' : 'Adult 2';
            req(p + 'Name', `Enter a name for ${label}.`, 1);
            req(p + 'Bio', `Write a biography for ${d[p + 'Name'] || label} (min 30 chars).`, 30);
        });
        req('network', 'Describe the external support network and its limits (min 25 chars).', 25);
        req('familyReflect', 'Complete the socialization / life course reflection (min 30 chars).', 30);
        if (!state.checks[1]?.passed) errs.push('Answer the Chapter 1 concept check question correctly.');
    }

    if (stepNum === 2) {
        const single = isSingleParent();
        req('jobA', 'Enter Adult 1’s work or study role.', 2);
        if (!single) req('jobB', 'Enter Adult 2’s work or study role.', 2);
        if (calcTotals().gross <= 0) errs.push('Monthly gross income must be greater than $0.');
        if ((Number(d.deductions) || 0) > calcTotals().gross) errs.push('Deductions cannot exceed gross income.');
        req('incomeBasis', 'Explain your income and deduction figures (min 25 chars).', 25);
        if (state.expenses.some(e => !String(e.source || '').trim())) {
            errs.push('Provide a source or justification for all 10 expense categories.');
        }
        req('budgetReflect', 'Explain the main budget tradeoff or shortfall (min 30 chars).', 30);
        req('carePlan', 'Describe childcare coverage and backup during work hours (min 30 chars).', 30);
        if (!state.checks[2]?.passed) errs.push('Answer the Chapter 2 concept check question correctly.');
    }

    if (stepNum === 3) {
        const single = isSingleParent();
        (single ? ['a'] : ['a', 'b']).forEach((p, idx) => {
            req(p + 'StyleExample', `Illustrate Adult ${idx + 1}’s love, communication, and parenting patterns (min 35 chars).`, 35);
        });
        req('lifestyle', 'Describe everyday routines and shared activities (min 25 chars).', 25);
        if (!state.conversation) errs.push('Play a response branch in the 3D Dialogue Rehearsal.');
        req('repair', 'Write your own revised response (min 25 chars).', 25);
        req('relationshipReflect', 'Analyze your revision using conflict concepts (min 30 chars).', 30);
        ['Money', 'Care', 'Talk', 'Time'].forEach(k => req('agreement' + k, `Complete Agreement commitment (${k}, min 20 chars).`, 20));
        if (!state.checks[3]?.passed) errs.push('Answer the Chapter 3 concept check question correctly.');
    }

    if (stepNum === 4) {
        if (!state.eventRun) errs.push('Click "Reveal Disruption Consequences" after writing your prediction.');
        req('eventReason', 'Justify your selected disruption response (min 30 chars).', 30);
        req('structural', 'Explain the structural constraint shaping options (min 30 chars).', 30);
        req('burden', 'Explain who bears the time, money, or emotional burden (min 30 chars).', 30);
        req('resourcePlan', 'Identify a community support or policy change (min 30 chars).', 30);
        if (!state.checks[4]?.passed) errs.push('Answer the Chapter 4 concept check question correctly.');
    }

    if (stepNum === 5) {
        if (!THEORIES[d.theory]) errs.push('Choose a primary sociological perspective.');
        req('theoryDefinition', 'Define the theory in your own words (min 25 chars).', 25);
        req('theorySource', 'Provide a textbook/course source reference (min 5 chars).', 5);
        req('theoryExample1', 'Complete Theory Application 1 (min 35 chars).', 35);
        req('theoryExample2', 'Complete Theory Application 2 (min 35 chars).', 35);
        if (!THEORIES[d.alternative] || d.alternative === d.theory) errs.push('Choose a different contrasting perspective.');
        req('theoryLimit', 'Explain what the contrasting perspective notices (min 35 chars).', 35);
        if (state.sources.some(s => s.claim.trim().length < 4 || s.source.trim().length < 6 || !s.date)) {
            errs.push('Complete all 3 evidence log records with claim, source, and date.');
        }
        if (!state.checks[5]?.passed) errs.push('Answer the Chapter 5 concept check question correctly.');
    }

    if (stepNum === 6) {
        req('futureAssumptions', 'Explain the assumptions behind your projected future budget (min 30 chars).', 30);
        req('pathA', 'Describe Path A (min 30 chars).', 30);
        req('pathB', 'Describe Path B backup plan (min 30 chars).', 30);
        const chosenConcepts = new Set([d.futureConcept1, d.futureConcept2, d.futureConcept3].filter(Boolean));
        if (chosenConcepts.size < 3) errs.push('Select 3 different textbook concepts in Chapter 6.');
        [1, 2, 3].forEach(n => req('futureApply' + n, `Apply Concept ${n} (min 25 chars).`, 25));
        req('learning', 'Complete your reflection on what changed in your thinking (min 30 chars).', 30);
        req('nextAction', 'Enter a concrete next action.', 3);
        req('owner', 'Specify who owns the next action.', 2);
        req('indicator', 'Specify an indicator of progress.', 3);
        req('backupPlan', 'Provide a backup plan if the action is blocked (min 30 chars).', 30);
        req('assistance', 'Complete the assistance declaration (min 15 chars).', 15);
        if (!d.ownWork) errs.push('Check the verification statement at the bottom of Chapter 6.');
        if (!state.checks[6]?.passed) errs.push('Answer the Chapter 6 concept check question correctly.');
    }

    return errs;
}

function isSimulationComplete() {
    return [0, 1, 2, 3, 4, 5, 6].every(n => validateChapter(n).length === 0);
}

function renderNavigation() {
    const navEl = document.getElementById('chapter-nav');
    if (!navEl) return;

    navEl.innerHTML = CHAPTER_SHORT.map((label, idx) => {
        const isCurrent = state.step === idx;
        const isDone = idx >= 1 && idx <= 6 && state.completed[idx] && validateChapter(idx).length === 0;
        return `<button onclick="goToStep(${idx})" class="px-2.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap flex items-center gap-1.5 transition ${
            isCurrent
                ? 'bg-slate-900 text-white shadow-sm'
                : isDone
                ? 'bg-emerald-50 text-emerald-800 border border-emerald-200'
                : 'text-slate-600 hover:bg-slate-100'
        }">
            <span class="w-4 h-4 rounded-full text-[10px] flex items-center justify-center ${isDone ? 'bg-emerald-600 text-white' : isCurrent ? 'bg-amber-400 text-slate-900' : 'bg-slate-200 text-slate-700'}">
                ${isDone ? '✓' : idx}
            </span>
            <span>${esc(label.split('·')[1] || label)}</span>
        </button>`;
    }).join('');

    const doneCount = [1, 2, 3, 4, 5, 6].filter(n => state.completed[n] && validateChapter(n).length === 0).length;
    const progEl = document.getElementById('footer-progress-text');
    if (progEl) progEl.textContent = `${doneCount} of 6 chapters complete`;

    const prevBtn = document.getElementById('btn-prev');
    if (prevBtn) prevBtn.disabled = (state.step === 0);

    const nextBtn = document.getElementById('btn-next');
    if (nextBtn) {
        if (state.step === 7) {
            nextBtn.textContent = '🖨️ Print Report';
        } else if (state.step === 6) {
            nextBtn.textContent = 'Complete & Open Portfolio →';
        } else {
            nextBtn.textContent = 'Save & Continue →';
        }
    }
}

function renderWorkspace(scrollToTop = true) {
    renderNavigation();
    updateTopHUD();
    updateRoomSceneMood();

    const mainEl = document.getElementById('workspace-scroll');
    if (!mainEl) return;

    const views = [renderStep0, renderStep1, renderStep2, renderStep3, renderStep4, renderStep5, renderStep6, renderStep7];
    mainEl.innerHTML = `<div id="validation-banner"></div>` + views[state.step]();
    if (scrollToTop) mainEl.scrollTop = 0;
}

window.goToStep = function(idx) {
    state.step = Math.max(0, Math.min(7, idx));
    saveState();
    renderWorkspace(true);
};

window.navigateStep = function(delta) {
    goToStep(state.step + delta);
};

window.saveAndAdvanceStep = function() {
    if (state.step === 7) {
        printPortfolioDocument('report');
        return;
    }
    const errs = validateChapter(state.step);
    if (errs.length > 0) {
        const banner = document.getElementById('validation-banner');
        if (banner) {
            banner.innerHTML = `<div class="bg-rose-50 border-l-4 border-rose-600 p-4 rounded-xl text-xs text-rose-950 space-y-1.5 mb-4 shadow-sm">
                <strong class="font-bold block text-sm">Please complete the following before advancing:</strong>
                <ul class="list-disc list-inside space-y-1">
                    ${errs.map(e => `<li>${esc(e)}</li>`).join('')}
                </ul>
            </div>`;
            document.getElementById('workspace-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
        }
        return;
    }
    state.completed[state.step] = true;
    if (isSimulationComplete() && !state.completedAt) {
        state.completedAt = new Date().toISOString();
    }
    goToStep(state.step + 1);
};

// Live Input Listener
document.addEventListener('input', ev => {
    const el = ev.target;
    const key = el.dataset?.key;
    if (!key) return;

    const val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? 0 : Number(el.value)) : el.value;
    state.data[key] = val;

    if (el.tagName === 'TEXTAREA' && el.dataset.min) {
        const min = Number(el.dataset.min) || 0;
        const len = String(val || '').trim().length;
        const words = countWords(val);
        const cntEl = document.getElementById('cnt-' + key);
        if (cntEl) {
            const met = len >= min;
            cntEl.className = `flex items-center justify-between text-[11px] mt-1 px-1 ${met ? 'text-teal-700 font-bold' : 'text-amber-700 font-medium'}`;
            cntEl.innerHTML = `<span>Minimum required: ${min} characters</span><span>${len} / ${min} chars (${words} words) ${met ? '✓ Meets requirement' : '— keep writing'}</span>`;
        }
    }

    if (['aName', 'bName', 'cName', 'cAge', 'jobA', 'jobB'].includes(key)) {
        rebuild3DFamily();
    }

    if (key === 'familyForm') {
        if (val === 'Single-parent household') {
            state.data.householdAdults = '1';
        }
        rebuild3DFamily();
        renderWorkspace(false);
    }

    if (['incomeA', 'incomeB', 'deductions'].includes(key)) {
        const t = calcTotals();
        const pill = document.getElementById('budget-summary-pill');
        if (pill) {
            pill.textContent = `Net ${money(t.net)} − Outflow ${money(t.spend)} = ${money(t.balance)}`;
            pill.className = `text-xs font-mono font-bold px-2.5 py-1 rounded-full ${t.balance < 0 ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}`;
        }
    }

    ['A', 'B'].forEach(suf => {
        const hEl = document.getElementById('hrs-left-' + suf);
        if (hEl) {
            const left = calcHoursLeft(suf);
            hEl.textContent = `${left}h free`;
            hEl.className = `text-xs font-mono font-bold ${left < 0 ? 'text-rose-600' : 'text-teal-700'}`;
        }
    });

    if (['futureIncome', 'futureDeductions', 'futureCostChange'].includes(key)) {
        const t = calcTotals();
        const futNet = (Number(state.data.futureIncome) || 0) - (Number(state.data.futureDeductions) || 0);
        const futSpend = Math.max(0, t.spend + (Number(state.data.futureCostChange) || 0));
        const futBal = futNet - futSpend;
        const fb = document.getElementById('future-balance-banner');
        if (fb) {
            fb.innerHTML = `<span>Current Balance: ${money(t.balance)}</span><span class="${futBal < 0 ? 'text-rose-700' : 'text-emerald-700'}">Projected Future Balance: ${money(futBal)}</span>`;
        }
    }

    if (key === 'theory') {
        renderWorkspace(false);
    }

    saveState();
});

window.run3DConversationRehearsal = function() {
    if (String(state.data.conversationPrediction || '').trim().length < 25) {
        showToast('Write your 25+ character prediction first before running the 3D dialogue.');
        return;
    }
    if (!state.data.reply) {
        showToast('Select one of the three dialogue replies first.');
        return;
    }
    const branches = {
        defend: {
            response: '“I was talking about afternoon pickup, and now we’re fighting over who works harder!”',
            explanation: 'Defensiveness and counter-blame escalate tension and leave the afternoon pickup gap unresolved.'
        },
        pause: {
            response: '“Okay. Let’s take 20 minutes to breathe and sit down with our calendars at 7:00.”',
            explanation: 'A mutually agreed cooling-off break prevents escalation—as long as both partners return at the agreed time.'
        },
        listen: {
            response: '“Thank you for hearing me. Tuesday and Thursday pickups are the hardest—let’s divide those right now.”',
            explanation: 'Active listening validates the invisible mental load and moves directly into concrete task-sharing.'
        }
    };
    const chosen = branches[state.data.reply];
    state.conversation = { choice: state.data.reply, ...chosen };
    trigger3DGesture(state.data.reply, 4500);
    setCameraFocus('all');
    saveState();
    renderWorkspace(false);
};

window.executeDisruptionScenario = function() {
    if (String(state.data.eventPrediction || '').trim().length < 30) {
        showToast('Record your prediction (at least 30 characters) before revealing the outcome.');
        return;
    }
    const evObj = EVENTS[state.data.event || 'care'];
    const opt = evObj.choices.find(c => c.id === state.data.eventChoice);
    if (!opt) {
        showToast('Select one of the three response strategies first.');
        return;
    }
    state.eventRun = {
        event: state.data.event,
        title: evObj.title,
        choice: opt.id,
        option: opt.title,
        cost: opt.cost,
        lost: opt.lost,
        hours: opt.hours,
        lesson: opt.lesson,
        prediction: state.eventRun?.prediction || state.data.eventPrediction
    };
    trigger3DGesture('defend', 2500);
    saveState();
    renderWorkspace(false);
};

window.selectQuizOption = function(chapterNum, optIdx) {
    state.checks[chapterNum] = {

        selected: optIdx,
        passed: false,
        feedback: ''
    };
    saveState();
};

window.checkQuizAnswer = function(chapterNum) {
    const qObj = QUIZZES[chapterNum];
    const current = state.checks[chapterNum] || {};
    if (current.selected === undefined) {
        showToast('Select an answer choice first.');
        return;
    }
    const passed = current.selected === qObj.answer;
    state.checks[chapterNum] = {
        selected: current.selected,
        attempts: (current.attempts || 0) + 1,
        passed,
        feedback: qObj.why
    };
    saveState();
    renderWorkspace(false);
};

function capture3DStageSnapshot() {
    try {

            return renderer.domElement.toDataURL('image/png');

    return '';
}

    const modal = document.getElementById('app-modal');
    title.textContent = 'Preview: 6-Section Family Summary Report';
    body.innerHTML = buildReportHTML(true);
    modal.classList.remove('hidden');
    modal.classList.add('flex');
};

window.previewCertificateModal = function() {
    if (!isSimulationComplete()) {
        showToast('Complete all 6 chapters first to unlock the certificate.');
        return;
    }
    const title = document.getElementById('modal-title');
    const body = document.getElementById('modal-body');
    const modal = document.getElementById('app-modal');
    title.textContent = 'Preview: Official Completion Certificate';
    body.innerHTML = buildCertificateHTML();
    modal.classList.remove('hidden');
    modal.classList.add('flex');
};

window.closeModal = function() {
    const modal = document.getElementById('app-modal');
    if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
};

window.printPortfolioDocument = function(type) {
    if (type === 'certificate' && !isSimulationComplete()) {
        showToast('Finish all 6 chapters first to print your completion certificate.');
        return;
    }
    closeModal();
    const printEl = document.getElementById('print-area');
    printEl.innerHTML = type === 'certificate' ? buildCertificateHTML() : buildReportHTML(true);
    setTimeout(() => window.print(), 150);
};

window.downloadStandaloneReportHTML = function() {
    const htmlDoc = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>${esc(state.data.familyName)} - Report</title></head><body style="padding:30px;">${buildReportHTML(true)}</body></html>`;
    const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Family_Futures_3D_Report.html';
    a.click();
    showToast('Downloaded standalone HTML report.');
};

window.downloadBudgetCSV = function() {
    const t = calcTotals();
    const rows = [
        ['Category', 'Monthly USD', 'Basis', 'Source / Justification'],
        ['Adult 1 Gross', state.data.incomeA, 'Income', state.data.incomeBasis],
        ['Adult 2 Gross', isSingleParent() ? 0 : state.data.incomeB, 'Income', state.data.incomeBasis],
        ['Monthly Deductions', state.data.deductions, 'Deductions', 'Payroll/Taxes'],
        ['Net Take-Home Income', t.net, 'Calculated', 'Gross minus deductions'],
        ...state.expenses.map(e => [e.label, e.amount, e.basis, e.source]),
        ['Total Outflow', t.spend, 'Calculated', 'Sum of 10 categories'],
        ['Net Monthly Balance', t.balance, 'Calculated', 'Net minus outflow']
    ];
    const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Family_Futures_3D_Budget.csv';
    a.click();
    showToast('Downloaded Budget CSV spreadsheet.');
};

window.downloadBackup = function() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Family_Futures_3D_Backup_${state.id}.json`;
    a.click();
    showToast('Saved JSON progress backup.');
};

window.restoreBackupFile = async function(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!parsed || !parsed.data || !Array.isArray(parsed.avatars)) {
            throw new Error('Invalid backup format.');
        }
        state = parsed;
        if (!state.data.householdAdults) state.data.householdAdults = '2';
        state.avatars.forEach((av, idx) => {
            if (!av.gender) av.gender = idx === 1 ? 'Male / Boy' : 'Female / Girl';
            if (!av.bottomStyle) av.bottomStyle = 'pants';
        });
        saveState();
        rebuild3DFamily();
        renderWorkspace(true);
        showToast('Backup restored!');
    } catch (err) {
        showToast('Could not load backup file.');
    } finally {
        ev.target.value = '';
    }
};

window.confirmResetSimulation = function() {
    const title = document.getElementById('modal-title');
    const body = document.getElementById('modal-body');
    const modal = document.getElementById('app-modal');
    title.textContent = 'Reset Simulation Progress?';
    body.innerHTML = `
        <p class="text-xs text-slate-700">This will clear your current saved entries in this browser and start a fresh family case. Download a JSON backup first if you want to keep your current work.</p>
        <div class="flex gap-2 pt-3">
            <button onclick="downloadBackup()" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-bold">💾 Save Backup First</button>
            <button onclick="executeResetSimulation()" class="px-3 py-1.5 rounded-lg bg-rose-700 text-white text-xs font-bold">Reset & Start Over</button>
            <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg bg-slate-200 text-slate-800 text-xs font-bold">Cancel</button>
        </div>
    `;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
};

window.executeResetSimulation = function() {
    localStorage.removeItem(STORAGE_KEY);
    state = createDefaultState();
    closeModal();
    rebuild3DFamily();
    renderWorkspace(true);
    showToast('Simulation reset to fresh starting state.');
};

window.onload = function() {
    renderWorkspace(true);
    initThreeScene();
};
</script>
</body>
</html>
