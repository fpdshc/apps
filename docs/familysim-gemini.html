<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Family Futures Simulation</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --navy: #1d2c5d;
            --blue: #344b89;
            --teal: #17645a;
            --gold: #ddc88e;
            --paper: rgba(245, 243, 236, 0.95);
        }
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background: #ddeeff;
        }
        /* 3D Canvas */
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2;
            pointer-events: none; /* Let clicks pass through to 3D if not on a panel */
            display: flex; justify-content: center; align-items: center;
        }
        .panel {
            background: var(--paper); border: 1px solid #dddfe4;
            border-radius: 12px; max-width: 650px; width: 90%; max-height: 90vh;
            overflow-y: auto; padding: 2rem; pointer-events: auto;
            box-shadow: 0 12px 35px rgba(29, 44, 93, 0.2);
            backdrop-filter: blur(5px);
        }
        h1, h2, h3 { color: var(--navy); margin-top: 0; }
        p { color: #444; line-height: 1.5; }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .col { flex: 1; min-width: 150px; background: white; padding: 1rem; border-radius: 8px; border: 1px solid #ccc; }
        
        /* Form Elements */
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-top: 0.5rem; color: var(--navy); }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 0.5rem; margin-top: 0.2rem;
            border: 1px solid #bdc5d0; border-radius: 6px; box-sizing: border-box;
        }
        input[type="color"] { width: 100%; height: 35px; border: none; cursor: pointer; }
        textarea { resize: vertical; min-height: 80px; }
        
        /* Buttons */
        .controls { display: flex; justify-content: space-between; margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 1rem; }
        button {
            background: var(--navy); color: white; border: none; border-radius: 6px;
            padding: 0.75rem 1.5rem; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--blue); }
        button.secondary { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
        button.secondary:hover { background: rgba(29, 44, 93, 0.1); }
        button.danger { background: #a23c38; }
        button.danger:hover { background: #8a3330; }

        /* Certificate Print Styles */
        #printArea { display: none; background: white; width: 100vw; min-height: 100vh; position: absolute; top: 0; left: 0; z-index: 10; padding: 3rem; box-sizing: border-box; }
        .cert-border { border: 4px double #8d7744; padding: 3rem; text-align: center; height: 100%; }
        
        @media print {
            #canvas-container, #ui-layer { display: none !important; }
            #printArea { display: block !important; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-layer">
    <div class="panel" id="panel-content">
        <!-- JS will inject UI here -->
    </div>
</div>

<div id="printArea">
    <div class="cert-border">
        <h2>Family Futures Simulation</h2>
        <h1>Certificate of Completion</h1>
        <p>This certifies that</p>
        <h2 id="cert-name">[Student Name]</h2>
        <p>has successfully constructed a 3D family model, managed budget constraints, resolved sociological scenarios, and applied theoretical frameworks.</p>
        <p>Completed on: <span id="cert-date"></span></p>
        <br><br>
        <p style="font-size: 0.8rem; color: #666;">Generated via Interactive 3D Simulation</p>
    </div>
</div>

<script>
/** 
 * THREE.JS 3D SCENE SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xddeeff);
scene.fog = new THREE.Fog(0xddeeff, 10, 50);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4, 10);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floorGeo = new THREE.PlaneGeometry(50, 50);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x88aa88, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Resize handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
