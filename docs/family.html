function promptText(){let real=val('promptMode')==='real-life planning';return `You are my family planning and sociology reflection assistant. ${real?'Help me plan everyday family responsibilities and resources using only details I choose to share. Start by asking my goal; do not assume the fictional family below describes my real life.':'Continue the FICTIONAL family case described below. Preserve established facts unless I explicitly revise them.'}\n\nHOW TO HELP\nAsk one manageable question at a time. Start with my own first idea, then help me compare options and explain tradeoffs. Do not write course submissions or invent reflections, citations, prices, benefit eligibility, or records. Label assumptions, evidence, and hypothetical outcomes separately. Ask who bears costs in time, money, and care. Include strengths and structural constraints. Do not stereotype family forms or demographic groups.\n\nCover family history and goals; income, deductions and expenses; care and weekly schedules; communication, love and parenting concepts; household agreements; external pressures; sociological perspectives; and conditional future plans. For course concepts, ask for my course definitions and source locations. Do not diagnose people or predict relationship outcomes.\n\nFor numbers, show units and calculations and ask me to check them independently. Distinguish monthly recurring costs from one-time shocks. Use original, current sources for legal, financial, medical, or program eligibility questions and direct decisions requiring professional judgment to a qualified person. This is not reproductive or medical counseling. Do not ask for account numbers, addresses, sensitive records, or identifying details about children. If I want real planning, use broad ranges and optional fictional names.\n\n${real?'MY REAL-LIFE PLANNING STARTER\nMy goal: [I will enter this]\nMy household and responsibilities: [optional broad description]\nMy budget range and time constraints: [optional]\nMy first idea and what I need help deciding: [I will enter this]\nDo not import the simulation’s prices, identities, or income as real facts.':`FICTIONAL CASE SNAPSHOT\nProject: ${val('familyName')}\nLocation: ${val('location')}\nFamily form: ${val('familyForm')}\nMembers: ${['a','b','c'].map(p=>`${val(p+'Name')}, age ${val(p+'Age')}: ${val(p+'Bio')}`).join('\n')}\nValue: ${val('value')}\nSupport: ${val('network')}\nMonthly gross: ${totals().gross}; deductions: ${num('deductions')}; net: ${totals().net}; outflow: ${totals().spend}; balance: ${totals().balance}. USD.\nBudget items: ${state.expenses.map(r=>`${r.label} ${r.amount} (${r.basis}: ${r.source})`).join('; ')}\nCare: ${val('carePlan')}\nAgreement: ${['Money','Care','Talk','Time'].map(k=>val('agreement'+k)).join(' / ')}\nEvent: ${state.eventRun?state.eventRun.title+'; choice '+state.eventRun.option:'Not yet run'}\nMy event reasoning: ${val('eventReason')}\nStructural influence: ${val('structural')}\nTheory: ${val('theory')}; my definition: ${val('theoryDefinition')}\nFuture A: ${val('pathA')}\nFuture B: ${val('pathB')}\nNext step: ${val('nextAction')}; owner ${val('owner')}; review ${val('reviewDate')}\nAll default and event figures are illustrative teaching assumptions, not verified local quotes.`}\n\nBEGIN by asking which decision I want to revisit and what I currently think. Help me reach and explain my own decision. End with a checklist I can evaluate, not a claim that my plan is guaranteed.`;}
function resourcesHTML(){return `<ul><li><a href="https://openstax.org/books/introduction-sociology-3e/pages/14-2-variations-in-family-life" target="_blank" rel="noopener">OpenStax · Variations in Family Life and theoretical perspectives</a></li><li><a href="https://openstax.org/books/introduction-sociology-3e/pages/14-1-what-is-marriage-what-is-a-family" target="_blank" rel="noopener">OpenStax · Marriage and family</a></li><li><a href="https://www.apa.org/act/resources/fact-sheets/parenting-styles.html" target="_blank" rel="noopener">American Psychological Association · Parenting styles</a></li><li><a href="https://www.gottman.com/blog/the-four-horsemen-the-antidotes/" target="_blank" rel="noopener">Gottman Institute · Conflict patterns and alternatives</a></li><li><a href="https://edtechdev.github.io/aied/faqs/verify-ai-output/" target="_blank" rel="noopener">AI in Education Knowledge Base · Verifying AI output</a></li></ul><p class="hint">External readings need internet access. The simulation itself does not. These links support concepts; they do not verify your family’s budget or current local services.</p>`;}
function help(){return `<h3>How to use this activity</h3><p>Work through six chapters. Save each chapter after its required entries and concept check. You can revisit any chapter. Edits reopen that chapter for completion; earlier decisions are not erased. The report always uses your latest entries.</p><p>There are no points for being rich, having a particular family form, or making the budget balance. Explain your reasoning and identify constraints. Short written-entry checks confirm presence, not accuracy. Concept checks give feedback and allow retries.</p><h3>Saving and privacy</h3><p>Autosave uses this browser’s local storage. A shared-device user may see saved work. Save a JSON backup to move devices, and use Start over to remove this activity’s local record. Never enter real account numbers, addresses, or private information about children. Exported files contain your entries.</p><h3>Downloads and printing</h3><p>Portfolio offers HTML reports and worksheets that open in any browser. Use Print / PDF and choose Save as PDF. The CSV is a snapshot for Excel or Sheets, not a formula-driven workbook. The certificate unlocks only when all six chapters and checks are complete. It is a local completion record, not verified identity or mastery.</p><h3>Model assumptions</h3><p>Budget values and event costs are fictional. Net = gross minus entered deductions. Balance = net minus entered monthly outflows including savings. Event effects are one-time costs and take-home income losses in one month. Replaying replaces the active event rather than charging it twice. Household time is modeled separately. No health, happiness, divorce, or eligibility predictions are made.</p><h3>For instructors</h3><p>Use the same six-section report with your course rubric. Supply approved definitions or ask students to record course sources. The starting gross income matches the original $30,000 constraint but is editable. Ask students to explain one decision under a small new condition. Browser-only activities can be altered; neither logs nor certificates prove authorship. Non-AI practice is built in. No student data is sent to a server by this file.</p><h3>Sources and inspiration</h3><p>Structure adapted from the supplied Family Creation assignments and Full Family Summary Example. The example’s historical costs and unsupported claims are not reused as facts. Inspired by the staged-choice approach of <a href="https://amlw05.github.io/life-planning-challenge/" target="_blank" rel="noopener">Life Planning Challenge</a>; this is an original implementation, not a copy of its code.</p>${resourcesHTML()}<h3>Concept reference</h3>${Object.entries(CONCEPTS).map(([k,v])=>`<p><b>${esc(k)}.</b> ${esc(v)}</p>`).join('')}${Object.entries(THEORIES).map(([k,v])=>`<p><b>${esc(k)}.</b> ${esc(v.def)}</p>`).join('')}<p>Family systems and feminist perspectives are included as broad analytical lenses; confirm terminology and definitions against your course text. The love labels are practice descriptors, not a complete theory or diagnostic scale.</p>`;}
const printStyle=`body{font:16px/1.6 Georgia,serif;color:#233047;max-width:950px;margin:35px auto;padding:25px}h1,h2,h3{color:#1d2c5d}h1{font-size:32px}h2{margin-top:30px}p{white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font:12px/1.4 system-ui,sans-serif;margin:15px 0}th,td{border:1px solid #ccd1d8;padding:9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#eef0f5}.hint{font:12px/1.5 system-ui,sans-serif}.eyebrow{text-transform:uppercase;letter-spacing:2px;font:12px system-ui,sans-serif}.certificate{text-align:center;border:3px double #8d7744;padding:50px}.recipient{font-size:30px}.seal{font-size:40px}.worksheetline{height:75px;border-bottom:1px solid #bbb}.printbutton{font:16px system-ui,sans-serif;padding:10px 20px;background:#1d2c5d;color:white;border:0;border-radius:6px}@media print{@page{margin:17mm}body{margin:0;padding:0;font-size:11pt}.printbutton{display:none}h2,h3{break-after:avoid}tr{break-inside:avoid}.certificate{min-height:200mm}}`;
function wrapDoc(title,body){return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(title)+'</title><style>'+printStyle+'</style></head><body><button class="printbutton" onclick="window.print()">Print or save as PDF</button>'+body+'<\/body><\/html>';}
function contentFor(type){return type==='report'?report():type==='certificate'?certificate():type==='worksheets'?worksheets():`<pre class="mono">${esc(promptText())}</pre>`;}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal();document.getElementById('modalBody').scrollTop=0;}
function download(name,text,mime){let blob=new Blob([text],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);state.artifacts.push({name,time:new Date().toISOString()});if(state.artifacts.length>100)state.artifacts.shift();save();toast('Download prepared: '+name);}
function csvCell(v){if(typeof v==='number')return String(v);let s=String(v??'');if(/^[\s]*[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function budgetCSV(){let t=totals(),r=state.eventRun;let rows=[['Family Futures budget snapshot','USD','No formulas; values at export'],['Family',val('familyName')],['Exported',new Date().toISOString()],[],['Item','Monthly amount USD','Basis / source'],['Adult 1 gross',num('incomeA'),val('incomeBasis')],['Adult 2 gross',num('incomeB'),val('incomeBasis')],['Gross total',t.gross],['Deductions',num('deductions')],['Net total',t.net],...state.expenses.map(r=>[r.label,r.amount,r.basis+': '+r.source]),['Total outflow including savings',t.spend],['Monthly balance before event',t.balance],[],['One-time event','Amount USD','Not recurring']];if(r)rows.push(['Event spending',r.cost,r.title],['Take-home income lost',r.lost,r.option],['Affected month balance',eventNumbers().after],['Starting cash plus month balance',eventNumbers().cashAfter]);else rows.push(['No event run',0]);rows.push([],['Future scenario gross',num('futureIncome')],['Future deductions',num('futureDeductions')],['Future outflow',Math.max(0,t.spend+num('futureCostChange'))],['Future balance',num('futureIncome')-num('futureDeductions')-Math.max(0,t.spend+num('futureCostChange'))],['Future assumptions',val('futureAssumptions')]);return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');}
function printDoc(type){if(type==='certificate'&&!completionReady()){toast('Finish all chapters first.');return;}let modal=document.getElementById('modal');if(modal.open)modal.close();document.getElementById('printArea').innerHTML=contentFor(type);window.print();}
document.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,n=+b.dataset.n,type=b.dataset.type;
if(a==='start'){let e=errorsFor(0);if(e.length)return showErrors(e);go(1);}
if(a==='nav')go(n);if(a==='back')go(state.step-1);
if(a==='next'){let e=errorsFor(state.step);if(e.length)return showErrors(e);state.completed[state.step]=true;if(completionReady())state.completedAt=new Date().toISOString();go(state.step+1);}
if(a==='choose'){let k=b.dataset.key;state.data[k]=b.dataset.value;if(k==='event'){state.data.eventChoice='';state.eventRun=null;state.eventHistory=[];state.data.eventPrediction='';}if(k==='reply')state.conversation=null;delete state.completed[state.step];invalidate();save();render();}
if(a==='quiz'){let q=QUESTIONS[n],s=state.checks[n]||{};if(s.selected===undefined){toast('Choose an answer first.');return;}s.attempts=(s.attempts||0)+1;s.passed=s.selected===q.answer;s.feedback=q.why;state.checks[n]=s;delete state.completed[n];invalidate();save();let y=scrollY;render();window.scrollTo(0,y);}
if(a==='conversation'){if(!textEnough('conversationPrediction',25)||!val('reply')){toast('Write a prediction and choose a reply first.');return;}const responses={defend:['“I am talking about pickup, but now I feel we are arguing about who works harder.”','Counter-blame can move the discussion away from a specific need. The concern about unpaid planning work is still unresolved.'],pause:['“Okay. Let’s come back at 7 and compare our schedules.”','A planned break may allow calming, but only if the conversation actually resumes. A pause without returning can become avoidance.'],listen:['“I need help on Tuesday and Thursday, including remembering the arrangements.”','Listening and naming specific tasks can support negotiation. Feasibility still depends on schedules and available resources.']};let r=responses[val('reply')];state.conversation={choice:val('reply'),response:r[0],explanation:r[1]};delete state.completed[3];invalidate();save();let y=scrollY;render();scrollTo(0,y);}
if(a==='runEvent'){let o=eventOption();if(!o){toast('Choose a response first.');return;}if(!state.eventRun&&!textEnough('eventPrediction',30)){toast('Record a prediction before revealing the outcome.');return;}let e=EVENTS[val('event')];let r={event:val('event'),choice:o.id,title:e.title,option:o.title,cost:o.cost,lost:o.lost,hours:o.hours,lesson:o.lesson,prediction:state.eventRun?.prediction||val('eventPrediction')};state.eventRun=r;if(!state.eventHistory.some(x=>x.choice===r.choice))state.eventHistory.push(r);delete state.completed[4];invalidate();save();let y=scrollY;render();scrollTo(0,y);}
if(a==='help')openModal('Guide & resources',help());if(a==='close')document.getElementById('modal').close();
if(a==='preview'){if(type==='certificate'&&!completionReady())return;openModal(type==='prompt'?'Your custom assistant prompt':type==='report'?'Family summary report':type==='worksheets'?'Planning worksheets':'Completion certificate',contentFor(type));}
if(a==='download'){if(type==='certificate'&&!completionReady())return;download('Family_Futures_'+type+(type==='prompt'?'.txt':'.html'),type==='prompt'?promptText():wrapDoc('Family Futures '+type,contentFor(type)),type==='prompt'?'text/plain;charset=utf-8':'text/html;charset=utf-8');}
if(a==='print')printDoc(type);if(a==='csv')download('Family_Futures_Budget.csv',budgetCSV(),'text/csv;charset=utf-8');
if(a==='copyPrompt'){try{await navigator.clipboard.writeText(promptText());toast('Prompt copied. Paste it into your chosen chatbot.');}catch(e){openModal('Copy your prompt',`<p>Select and copy the text below.</p><textarea aria-label="Custom prompt" style="width:100%;height:55vh">${esc(promptText())}</textarea>`);}}
if(a==='backup')download('Family_Futures_Backup.json',JSON.stringify(state,null,2),'application/json');
if(a==='restore')document.getElementById('importFile').click();
if(a==='reset')openModal('Start a new family?',`<p>This removes this activity’s saved progress from this browser. Download a backup first if you want to keep it. Files you already downloaded are unchanged.</p><div class="flex"><button data-action="backup">Save backup</button><button class="danger" data-action="confirmReset">Clear progress and restart</button><button data-action="close">Cancel</button></div>`);
if(a==='confirmReset'){state=fresh();document.getElementById('modal').close();save();render(true);toast('A new family journey is ready.');}
});
document.getElementById('importFile').addEventListener('change',async ev=>{let f=ev.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('The backup must be under 1 MB.');let s=JSON.parse(await f.text());if(!validState(s))throw Error('This is not a compatible Family Futures backup.');if(s.eventRun){let e=EVENTS[s.eventRun.event],o=e?.choices.find(o=>o.id===s.eventRun.choice);if(!o)throw Error('Invalid scenario record.');s.eventRun={...s.eventRun,title:e.title,option:o.title,cost:o.cost,lost:o.lost,hours:o.hours,lesson:o.lesson};}if(!confirm('Replace the current journey with this backup? Save your current backup first if needed.'))return;state=s;for(let n=1;n<=6;n++){if(!QUESTIONS[n]||state.checks[n]?.selected!==QUESTIONS[n].answer){state.checks[n]={};delete state.completed[n];}if(errorsFor(n).length)delete state.completed[n];}if(!completionReady())state.completedAt=null;save();render(true);toast('Backup restored.');}catch(e){toast(e.message||'Unable to read backup.');}finally{ev.target.value='';}});
window.addEventListener('beforeprint',()=>{if(!document.getElementById('printArea').innerHTML)document.getElementById('printArea').innerHTML=report();});
window.addEventListener('afterprint',()=>document.getElementById('printArea').innerHTML='');
render();if(storageOK)document.getElementById('saveStatus').textContent='Autosave on this device';
