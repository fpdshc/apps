13px;color:var(--muted)}.badge{display:inline-block;border-radius:30px;padding:5px 11px;background:#e9ecef;font-size:12px;font-weight:650}.badge.gold{background:#f0e8d4;color:#66501a}.badge.green{background:#e1efe7;color:#135044}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}.stat span{font-size:12px;color:var(--muted);display:block}.stat strong{font-size:24px;color:var(--navy);font-weight:650}.negative{color:var(--rose)!important}.positive{color:var(--teal)!important}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{text-align:left;position:relative;padding:17px;border:1px solid #bfc7d3;display:block;min-height:106px}.choice strong{display:block;font-size:15px}.choice span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:7px}.choice[aria-pressed=true]{border:2px solid var(--teal);padding:16px;background:#eef6f2}.choice[aria-pressed=true]::after{content:'Selected';display:block;color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-top:8px}.feedback{border-left:4px solid var(--teal);padding:13px 16px;background:#edf5f1;margin:16px 0}.feedback.warm{border-color:#b1812e;background:#fbf4e5}.feedback.error{border-color:var(--rose);background:#fff0ed}.quiz fieldset{border:0;padding:0;margin:0}.quiz legend{font-weight:700;margin-bottom:12px}.quiz label{display:flex;gap:9px;padding:10px;background:#f5f6f8;border-radius:6px;margin:7px 0}.quiz input{margin-top:6px;flex-shrink:0}.quiz .primary{margin-top:12px}details{border-top:1px solid var(--line);padding:13px 0}summary{font-weight:650;cursor:pointer;color:var(--blue)}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:22px;margin-top:30px;flex-wrap:wrap}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;vertical-align:top}th{color:var(--navy);background:#f1f3f7}td input{width:100%;min-width:75px;border:1px solid #bdc5d0;padding:8px}td textarea{width:100%;min-width:145px;border:1px solid #bdc5d0;padding:8px;min-height:58px}td:nth-child(2){min-width:115px}.mini{font-size:12px;color:var(--muted)}.stepintro{max-width:790px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;padding:15px 0}.art{background:#e7ebdf;border-radius:50% 50% 8px 8px;aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden}.art svg{width:88%;height:88%}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:10px 0}.bar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#ddd;margin:10px 0}.bar div{height:100%;min-width:0}.output{border:1px solid var(--line);border-radius:12px;padding:20px;background:white;display:flex;flex-direction:column}.output p{font-size:14px;color:var(--muted);flex:1}.output .flex{margin-top:10px}.quote{font-family:Georgia,serif;font-size:23px;line-height:1.45;color:var(--navy)}dialog{width:min(880px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:14px;padding:26px}dialog::backdrop{background:#14203f99}.dialoghead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-26px;background:white;padding:10px 0;z-index:2}.document{font:15px/1.65 Georgia,serif;color:#202b3d}.document h1{font-size:30px}.document h2{font:700 21px Georgia,serif;margin-top:25px}.document h3{font:700 16px Georgia,serif}.document p{white-space:pre-wrap}.document table{font:12px/1.4 system-ui,sans-serif}.certificate{border:3px double #8d7744;padding:45px;text-align:center;min-height:500px}.certificate h1{font-size:37px}.certificate .recipient{font-size:30px;margin:30px 0}.certificate .seal{margin:auto;width:70px;height:70px;border-radius:50%;background:#eee4c7;color:var(--navy);display:grid;place-items:center;font-size:32px}.worksheetline{min-height:70px;border-bottom:1px solid #ccc;margin:10px 0}.notice{font-size:13px;padding:13px;background:#f5edda;border-radius:8px;color:#55452b}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 22px;border-radius:10px;z-index:50;max-width:90vw;box-shadow:var(--shadow)}#toast:empty{display:none}#printArea{display:none}.skip{position:absolute;left:10px;top:-60px;background:white;padding:10px;z-index:100}.skip:focus{top:10px}.goal{padding:15px 0;border-bottom:1px solid var(--line)}.goal b{color:var(--navy)}.errorlist{padding:15px 20px;background:#fff0ed;border:1px solid #e9b8b0;border-radius:10px;color:#7f2924}.mark{color:var(--teal)}.sourceRow{background:#f5f6f8;padding:13px;border-radius:8px;margin:12px 0}button .sub{font-size:11px;font-weight:400}.mono{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.printbutton{margin:18px 0}body.printing>*{display:none!important}body.printing #printArea{display:block!important;background:white;color:black}.draft{color:var(--rose);font-size:12px;font-family:system-ui,sans-serif}.char-counter{font-size:11px;text-align:right;color:var(--muted);margin-top:4px;margin-bottom:8px;transition:color 0.3s;}.char-counter.met{color:var(--teal);font-weight:650;}

@media print{@page{margin:17mm}body{background:white}body>*{display:none!important}#printArea{display:block!important}.document{font-size:11pt}.document h1{font-size:25pt}.document h2{break-after:avoid}.document tr{break-inside:avoid}.certificate{min-height:200mm}.printbutton{display:none}a{color:black;text-decoration:none}}

<header><div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M4 20 20 6l16 14M9 17v18h22V17M17 35V24h7v11" stroke="currentColor" stroke-width="2.5"/></svg><div><strong>Family Futures</strong><span>A sociology learning simulation</span></div></div><div class="toptools"><span class="save" id="saveStatus" role="status">Ready to save locally</span><button class="small" data-action="backup">Save backup</button><button class="small" data-action="help">Guide & resources</button></div></header>
<div class="layout"><aside><p class="navtitle">Your family journey</p><nav id="nav" aria-label="Simulation chapters"></nav><div class="progress"><div id="progressbar"></div></div><p class="progresslabel" id="progresslabel"></p><p class="sidebar-note">A family is more than its budget.<br><br>Explore the connections between choices, relationships, and social conditions.</p><button class="small ghost" data-action="restore">Restore backup</button><button class="small ghost danger" data-action="reset">Start over</button></aside><main id="main" tabindex="-1"></main></div>
<div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button data-action="close">Close</button></div><div id="modalBody"></div></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><div id="printArea"></div>
<script>
'use strict';
const VERSION=1, KEY='family-futures-v1';
const CHAPTERS=['Welcome','Who are we?','What do we do?','How do we live?','What issues arise?','How do we compare?','Survive & thrive','Your portfolio'];
const SHORT=['Welcome','Family','Resources','Relationships','Challenges','Theory','Future','Portfolio'];
const EXPENSES=[['Housing',1050],['Utilities',150],['Food',420],['Transport',160],['Childcare',400],['Healthcare / insurance',100],['Phone / internet',65],['Clothing / household',50],['Other / debt payment',0],['Savings contribution',25]];
const THEORIES={
 'Conflict perspective':{def:'Examines how unequal resources and power shape family roles, decisions, and opportunities.',ask:'Who controls resources, who does unpaid work, and whose options are constrained?'},
 'Symbolic interactionism':{def:'Examines how people create and interpret meanings through everyday interaction.',ask:'What does “being a good partner” mean to each adult, and how do they negotiate that meaning?'},
 'Structural functionalism':{def:'Examines functions that families perform, such as socialization, care, and support, and how these connect with other institutions.',ask:'How are care and socialization organized, and what happens when another institution cannot meet a need?'},
 'Family systems perspective':{def:'Treats the family as an interdependent system: a change in one relationship or role can affect other parts of the family.',ask:'How does a work-schedule change affect care, couple interaction, and the child’s routine?'},
 'Feminist perspective':{def:'Examines how gendered power, expectations, and intersecting inequalities shape family life and paid and unpaid work.',ask:'Which expectations shape who notices, plans, and performs care work, and how could that change?'}
};
const CONCEPTS={
 'Socialization':'Learning norms, expectations, and practices through interaction with others.',
 'Life course':'Examining how timing, transitions, linked lives, and historical circumstances shape a life.',
 'Role conflict':'Competing expectations between roles, such as employee and caregiver. Role strain concerns demands within one role.',
 'Unpaid care work':'Caregiving and household work that supports daily life without direct pay.',
 'Gender expectations':'Social expectations associated with gender; they are not fixed abilities or inevitable preferences.',
 'Social support':'Emotional, practical, or informational help through relationships or organizations; access and availability vary.',
 'Structural constraint':'An institutional or social condition that limits available options, such as work scheduling or childcare access.',
 'Companionate love':'A pattern emphasizing emotional closeness and commitment; use your course’s love framework for the assessed interpretation.',
 'Authoritative parenting':'A pattern combining responsiveness and warmth with clear expectations and limits.',
 'Authoritarian parenting':'A pattern emphasizing control and obedience with relatively less responsiveness.',
 'Permissive parenting':'A pattern high in warmth with relatively few limits or demands.',
 'Uninvolved parenting':'A pattern low in responsiveness and demands; one tired moment cannot establish a parenting style.',
 'Criticism':'Attacking a person’s character rather than describing a specific behavior or need.',
 'Contempt':'Expressing disrespect or superiority, such as ridicule.',
 'Defensiveness':'Deflecting responsibility or responding to a concern with counter-blame.',
 'Stonewalling':'Withdrawing from interaction. An agreed calming break with a return time is different.',
 'Active listening':'Checking your understanding of what someone means before responding.',
 'Resilience':'Adapting with available relationships, resources, and supports; it does not mean structural barriers disappear.'
};
const QUESTIONS={
 1:{q:'Two families have the same structure. What can you reasonably conclude?',options:['Their communication and resources will be the same.','You need more information about their histories, resources, and interactions.','One structure guarantees a better outcome.'],answer:1,why:'Family structure alone does not establish strengths, resources, or outcomes. Look at specific circumstances and variation within groups.'},
 2:{q:'Your fictional budget has a monthly deficit. What is the strongest next step?',options:['Use gross pay as take-home pay.','Delete childcare without explaining who provides care.','Check costs and income assumptions, then explain feasible tradeoffs and constraints.'],answer:2,why:'A deficit is a finding to investigate. Keep gross income, deductions, recurring costs, and one-time costs distinct; do not invent resources.'},
 3:{q:'Which response best addresses a specific concern without attacking character?',options:['You never care about this family.','You are worse than I am.','I am overwhelmed by pickup today. Can we compare our schedules and agree on coverage?'],answer:2,why:'This response names a concern and invites a concrete discussion. It is not a guarantee that a disagreement will be resolved.'},
 4:{q:'Two families respond differently to the same childcare interruption. Which explanation is most sociological?',options:['Only their effort matters.','Their work schedules, support networks, and access to care shape different options.','The simulation proves which family is better.'],answer:1,why:'Choices occur within unequal opportunities and constraints. The event is not a test of a family’s worth.'},
 5:{q:'How do you apply a theory rather than merely name it?',options:['Define its idea, connect it to case evidence, and explain what the connection reveals.','Copy the theory name beside the family name.','Assume the theory predicts every outcome.'],answer:0,why:'A theory application links an explanatory idea to specific evidence and a mechanism. Consider what another perspective would notice.'},
 6:{q:'Which statement is a defensible future prediction?',options:['Our family will definitely succeed because they love each other.','The chatbot can determine whether they will divorce.','If work hours remain stable and care remains available, this plan may be feasible; we need a backup if either changes.'],answer:2,why:'Conditional predictions state assumptions, consider uncertainty, and identify alternatives. This model cannot predict real relationships.'}
};
function fresh(){return {version:VERSION,step:0,startedAt:new Date().toISOString(),id:makeId(),completed:{},checks:{},data:{location:'Tampa area',familyForm:'Married partners',aAge:26,bAge:28,cAge:5,incomeA:1500,incomeB:1000,deductions:300,cash:500,careA:18,careB:18,paidA:25,paidB:20,studyA:0,studyB:0,otherA:14,otherB:14,commuteA:5,commuteB:5,workPlan:'Overlapping day shifts',event:'care',futureIncome:2500,futureDeductions:300,futureCostChange:0,promptMode:'fictional'},expenses:EXPENSES.map(([label,amount])=>({label,amount,source:'Illustrative scenario amount — not a current local quote',basis:'Scenario assumption'})),sources:[{claim:'',source:'',date:''},{claim:'',source:'',date:''},{claim:'',source:'',date:''}],eventRun:null,eventHistory:[],conversation:null,completedAt:null,artifacts:[]};}
function makeId(){return 'FF-'+(globalThis.crypto?.randomUUID?.()||Math.random().toString(36).slice(2)).slice(0,8).toUpperCase();}
let state=fresh(),storageOK=true,saveTimer;
try{let raw=localStorage.getItem(KEY);if(raw){let p=JSON.parse(raw);if(validState(p))state=p;else storageOK=false;}}catch(e){storageOK=false;}
function validState(s){return !!s&&s.version===1&&Number.isInteger(s.step)&&s.step>=0&&s.step<=7&&typeof s.data==='object'&&s.data!==null&&!Array.isArray(s.data)&&Object.values(s.data).every(v=>(typeof v==='string'&&v.length<=20000)||(typeof v==='number'&&Number.isFinite(v)&&Math.abs(v)<=10000000)||typeof v==='boolean')&&Array.isArray(s.expenses)&&s.expenses.length===10&&s.expenses.every(r=>typeof r.label==='string'&&Number.isFinite(r.amount)&&r.amount>=0&&r.amount<=1000000&&typeof r.source==='string'&&['Scenario assumption','Researched evidence'].includes(r.basis))&&Array.isArray(s.sources)&&s.sources.length===3&&s.sources.every(r=>typeof r.claim==='string'&&typeof r.source==='string'&&typeof r.date==='string')&&s.completed&&typeof s.completed==='object'&&s.checks&&typeof s.checks==='object'&&Array.isArray(s.eventHistory)&&s.eventHistory.length<100&&Array.isArray(s.artifacts)&&s.artifacts.length<1000&&typeof s.id==='string'&&s.id.length<100&&typeof s.startedAt==='string'&&(s.completedAt===null||typeof s.completedAt==='string')&&Object.values(s.checks).every(c=>c&&typeof c==='object')&&(s.conversation===null||(s.conversation&&['defend','pause','listen'].includes(s.conversation.choice)&&typeof s.conversation.response==='string'&&typeof s.conversation.explanation==='string'))&&[s.eventRun,...s.eventHistory].every(r=>r===null||(r&&typeof r==='object'&&['care','transport'].includes(r.event)&&typeof r.choice==='string'&&typeof r.prediction==='string'&&['cost','lost','hours'].every(k=>Number.isFinite(r[k]))));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const d=()=>state.data, val=k=>d()[k]??'', num=k=>Number(val(k))||0;
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);
const qty=v=>Number.isInteger(v)?String(v):v.toFixed(1);
function totals(){const gross=num('incomeA')+num('incomeB'),net=gross-num('deductions'),spend=state.expenses.reduce((a,r)=>a+r.amount,0);return{gross,net,spend,balance:net-spend};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;document.getElementById('saveStatus').textContent='Saved on this device';}catch(e){storageOK=false;document.getElementById('saveStatus').textContent='Autosave unavailable — save a backup';}}
function toast(t){document.getElementById('toast').textContent=t;clearTimeout(saveTimer);saveTimer=setTimeout(()=>document.getElementById('toast').textContent='',5000);}

function field(key,label,{type='text',hint='',min,max,options,rows=3,placeholder=''}={}){
 let attrs=`data-key="${key}" id="f-${key}"`;
 let v=val(key);
 let isTextarea = (type === 'textarea');
 let el=options?`<select ${attrs}><option value="">Choose…</option>${options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:isTextarea?`<textarea ${attrs} rows="${rows}" maxlength="4000" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`:`<input ${attrs} type="${type}" value="${esc(v)}" ${!isTextarea&&min!==undefined?`min="${min}"`:''} ${!isTextarea&&max!==undefined?`max="${max}"`:''} ${type==='number'?'step="any"':''} ${type==='text'?'maxlength="200"':''} placeholder="${esc(placeholder)}">`;
 let currentLen = String(v||'').trim().length;
 let counterHTML = (isTextarea && min) ? `<div class="char-counter ${currentLen >= min ? 'met' : ''}" id="cnt-${key}">${currentLen} / ${min} chars min</div>` : '';
 return `<label class="field" for="f-${key}"><span>${label}</span>${el}${counterHTML}${hint?`<small>${hint}</small>`:''}</label>`;
}

function check(key,text){return `<label class="checkline"><input type="checkbox" data-key="${key}" ${val(key)?'checked':''}><span>${text}</span></label>`;}
function options(key,arr){return `<div class="choices">${arr.map(([value,title,text])=>`<button class="choice" data-action="choose" data-key="${key}" data-value="${esc(value)}" aria-pressed="${val(key)===value}"><strong>${title}</strong><span>${text}</span></button>`).join('')}</div>`;}
function section(title,body,cls=''){return `<section class="section ${cls}"><h2>${title}</h2>${body}</section>`;}
function intro(n,title,desc){return `<div class="stepintro"><span class="eyebrow">Chapter ${n} of 6 · ${['','Identity & history','Money & time','Connection & care','Choices & constraints','Sociological explanation','Planning & reflection'][n]}</span><h1>${title}</h1><p class="lead">${desc}</p></div>`;}
function conceptPanel(keys){return `<details><summary>Concept notes for this chapter</summary>${keys.map(k=>`<p><b>${esc(k)}.</b> ${esc(CONCEPTS[k]||THEORIES[k]?.def||'')}</p>`).join('')}<p class="hint">These short descriptions support practice. Use your course’s definitions and sources for your final interpretation. See Guide & resources.</p></details>`;}
function quiz(n){let q=QUESTIONS[n],s=state.checks[n]||{};return section('Check your understanding',`<div class="quiz"><fieldset><legend>${q.q}</legend>${q.options.map((o,i)=>`<label><input type="radio" name="quiz${n}" data-quiz="${n}" value="${i}" ${s.selected===i?'checked':''}>${o}</label>`).join('')}</fieldset><button data-action="quiz" data-n="${n}" class="primary small">Check answer</button>${s.feedback?`<div class="feedback ${s.passed?'':'warm'}" role="status"><b>${s.passed?'Concept check complete.':'Try again after reviewing.'}</b> ${esc(s.feedback)}</div>`:''}</div>`);}
function footer(n){return `<div id="errors" role="alert"></div><div class="actions"><button data-action="back">← Back</button><span class="hint">Progress saves as you work.</span><button class="primary" data-action="next">${n===6?'Complete & open portfolio':'Save chapter & continue'} →</button></div>`;}
function nav(){document.getElementById('nav').innerHTML=SHORT.map((t,i)=>`<button data-action="nav" data-n="${i}" ${i===state.step?'aria-current="step"':''}><span class="num ${state.completed[i]?'done':''}">${state.completed[i]?'✓':i===0?'○':i===7?'↗':i}</span><span>${t}</span></button>`).join('');let count=Object.keys(state.completed).filter(k=>+k>=1&&+k<=6&&state.completed[k]).length;document.getElementById('progressbar').style.width=(count/6*100)+'%';document.getElementById('progresslabel').textContent=count+' of 6 chapters completed';}
function stats(){let t=totals();return `<div class="stats"><div class="stat"><span>Take-home income / month</span><strong>${money(t.net)}</strong></div><div class="stat"><span>Budgeted outflow / month</span><strong>${money(t.spend)}</strong></div><div class="stat"><span>Monthly balance before event</span><strong class="${t.balance<0?'negative':'positive'}">${money(t.balance)}</strong></div></div>`;}
function home(){return `<div class="hero"><div><span class="eyebrow">Six chapters. One connected family.</span><h1>Build a family.<br>Explore the possibilities.</h1><p class="lead">Make decisions about money, care, relationships, and the future. Discover how personal choices and social conditions shape one another.</p><div class="flex"><span class="badge gold">45–75 minutes + research</span><span class="badge">Offline · no account needed</span></div></div><div class="art" aria-hidden="true"><svg viewBox="0 0 340 340"><circle cx="270" cy="64" r="34" fill="#ddc88e"/><path d="M30 191 171 63l139 128" fill="none" stroke="#1d2c5d" stroke-width="14" stroke-linecap="round"/><path d="M65 170v135h217V170" fill="#fffdf7"/><path d="M50 310h246" stroke="#1d2c5d" stroke-width="8"/><rect x="88" y="181" width="43" height="48" rx="3" fill="#c6d8ce"/><rect x="223" y="181" width="34" height="48" rx="3" fill="#ddc88e"/><circle cx="146" cy="221" r="22" fill="#1d2c5d"/><path d="M116 302v-39q30-35 60 0v39" fill="#344b89"/><circle cx="210" cy="220" r="22" fill="#8b6955"/><path d="M180 302v-39q30-35 60 0v39" fill="#17645a"/><circle cx="179" cy="263" r="15" fill="#b18062"/><path d="M159 306v-19q20-24 40 0v19" fill="#ddc88e"/></svg></div></div>`+
section('Purpose', `<p><b>Skills:</b> This assignment helps you practice applying sociological theories and concepts to real-world scenarios, evaluating resource constraints, and synthesizing budget data with family dynamics.</p><p><b>Knowledge:</b> You will become familiar with the impact of structural constraints, social support, and unequal resources on family life, while applying at least five textbook concepts and one theoretical perspective.</p>`)+
section('Task', `<p>Follow these steps to complete your family simulation:</p><ol><li><b>Create a family:</b> Develop a non-traditional family structure, assigning members roles and backgrounds outside of traditional norms.</li><li><b>Build a budget:</b> Enter income and expenses. <b>Crucially:</b> you must justify every expense with evidence or clear logical assumptions.</li><li><b>Apply theory and concepts:</b> As you progress through chapters, correctly define and apply your chosen sociological theory and at least five specific concepts from the text.</li><li><b>Write detailed responses:</b> Meet the minimum character requirements shown below each text box (indicated by the live counter) to ensure adequate depth.</li><li><b>Export & Enhance:</b> Download your final portfolio. To achieve full creativity points, you must add 4 or more pictures, graphs, or artistic elements to your exported final document before submitting it.</li></ol>`)+
section('Criteria for Success', `<p>Review the following characteristics of high-quality work to evaluate your efforts while you work. Your final portfolio will be evaluated on:</p><ul><li><b>Content (Excellent):</b> All 6 sections completed; theory is clearly identified, defined, and used properly; at least 5 concepts used correctly over all sections; all expenses are justified with evidence.</li><li><b>Originality (Excellent):</b> Chooses topics and family members outside of traditional family roles.</li><li><b>Organization (Excellent):</b> Well-organized with individual sections and headers; exemplary punctuation and grammar.</li><li><b>Creativity (Excellent):</b> The final submission incorporates 4 or more pictures, graphs, or other artistic measures.</li></ul><p><i>Example of an excellent theory application:</i> Instead of simply stating "Conflict theory means fighting," an excellent response defines who controls the resources in the specific fictional family, whose options are constrained, and explicitly links this to the budget deficit you created.</p><p><i>Example of excellent expense justification:</i> Instead of "Housing is $1000", an excellent response states "Housing is $1500 based on the average rent for a 2-bedroom apartment in Tampa, FL (Zillow, Oct 2026)."</p><p class="notice">This activity is about family life and resource planning, not medical or reproductive-health counseling. Use fictional information. No family structure is scored as better or worse.</p>`)+
section('Set up your journey', `<div class="grid2">${field('learner','Name or nickname for your portfolio',{hint:'Use a course alias if preferred. This stays in this browser unless you export or share it.'})}${field('course','Course or section',{hint:'Optional.'})}</div>${check('introRead','I will use a fictional family, make my own decisions, and explain what I learn. I understand that scenario prices are teaching assumptions, not current local quotes.')}<p class="hint">Everything works without an AI account. The simulation uses transparent, prewritten branches—not a live AI model. Your own writing becomes your report. Browser storage can be cleared; download a backup when you pause.</p><div id="errors" role="alert"></div><button class="primary" data-action="start">${state.step===0&&state.completed[1]?'Continue your journey':'Begin your family journey'} →</button>`);}
function family(){return intro(1,'Who are we?','Create people with histories, strengths, and connections. Family structure alone does not explain how a family lives.')+section('Set the scene',`<div class="grid2">${field('familyName','Family name or project title',{placeholder:'The Rivera household'})}${field('location','Location')}${field('familyForm','Relationship between the adults',{options:['Married partners','Cohabiting partners','Blended family partners','Co-parents in one household','Adult relatives sharing care','Other chosen family arrangement']})}${field('value','A guiding family value',{options:['Security','Connection','Education and growth','Community participation','Fairness and shared responsibility']})}</div>${field('origin','How did this family come together?',{type:'textarea',min:20,hint:'Explain shared history and relevant relationships. All arrangements can have strengths and challenges.'})}`)+section('Meet the family',`<div class="grid3">${['a','b','c'].map((p,i)=>`<div><span class="badge">${i===2?'Child under 10':'Adult '+(i+1)}</span>${field(p+'Name','Name')}${field(p+'Age','Age',{type:'number',min:i===2?0:18,max:i===2?9:100})}${field(p+'Identity','Relevant identity or background',{hint:i===2?'Optional cultural background or interests.':'Optional: identities relevant to your analysis; avoid stereotypes.'})}${field(p+'Bio','Biography',{type:'textarea',min:30,rows:5,hint:'Write 2–4 sentences: history, interests, a strength, and a relationship. Your words appear in the report.'})}</div>`).join('')}</div>${field('network','Support network and its limits',{type:'textarea',min:25,hint:'Who can help, with what, when, and why? Explain availability rather than assuming free care.'})}${conceptPanel(['Socialization','Life course','Social support'])}`)+section('Your first interpretation',field('familyReflect','How might one person’s history influence a current choice?',{type:'textarea',min:30,hint:'Connect a specific biography detail to socialization or the life course. Minimum 30 characters; quality is reviewed by your instructor.'}))+quiz(1)+footer(1);}
function budget(){let t=totals();return intro(2,'What do we do?','Build a plan for both money and time. A realistic shortfall is something to investigate, not a reason to invent resources.')+`<div id="liveStats">${stats()}</div>`+section('Income and working time',`<p>The starting scenario uses <b>$30,000 gross per year ($2,500 per month)</b>. You can adjust it if your instructor permits. Deductions and expenses below are editable fictional assumptions.</p><div class="grid2">${field('jobA','Adult 1 work or study role')}${field('jobB','Adult 2 work or study role')}${field('incomeA','Adult 1 gross income per month ($)',{type:'number',min:0,max:100000})}${field('incomeB','Adult 2 gross income per month ($)',{type:'number',min:0,max:100000})}${field('deductions','Combined monthly deductions ($)',{type:'number',min:0,max:100000,hint:'Taxes, payroll insurance, or other deductions. Do not count the same insurance again as an expense.'})}${field('cash','Starting emergency cash ($)',{type:'number',min:0,max:100000})}</div>${field('incomeBasis','Explain jobs, hours, income, and deductions',{type:'textarea',min:25,hint:'State the basis for figures. Income need not match a real wage quote unless your instructor requires research.'})}<p id="grossNote" class="hint">Annual gross: ${money(t.gross*12)}. Net = gross − deductions.</p>`)+section('Your monthly budget',`<p class="hint">Edit amounts and identify their basis. Every starter value is an illustrative teaching assumption. For a research-based final project, replace estimates with sources you actually read.</p><div class="tablewrap"><table><thead><tr><th scope="col">Category</th><th scope="col">Monthly $</th><th scope="col">Basis</th><th scope="col">Source or explanation</th></tr></thead><tbody>${state.expenses.map((r,i)=>`<tr><th scope="row">${esc(r.label)}</th><td><input aria-label="${esc(r.label)} monthly amount" type="number" min="0" max="1000000" step="0.01" data-expense="${i}" data-part="amount" value="${r.amount}"></td><td><select aria-label="${esc(r.label)} evidence basis" data-expense="${i}" data-part="basis">${['Scenario assumption','Researched evidence'].map(o=>`<option ${r.basis===o?'selected':''}>${o}</option>`).join('')}</select></td><td><textarea aria-label="${esc(r.label)} source or explanation" maxlength="1000" data-expense="${i}" data-part="source" placeholder="Min 1 char required">${esc(r.source)}</textarea></td></tr>`).join('')}</tbody></table></div><div id="budgetFeedback">${budgetFeedback()}</div>${field('budgetReflect','Explain the main tradeoff or shortfall',{type:'textarea',min:30,hint:'What can the family change? What would require additional support or an institutional change? Explain any zero-cost arrangement.'})}`)+section('A week has 168 hours',`<p>Model each adult’s weekly load. We reserve <b>56 hours for sleep</b> as a scenario assumption, then subtract the entered hours. Avoid double counting simultaneous tasks. Remaining time is not a measure of well-being.</p><div class="grid2">${['A','B'].map((p,i)=>`<div><h3>${esc(val(i?'bName':'aName')||'Adult '+(i+1))}</h3>${field('paid'+p,'Paid work hours / week',{type:'number',min:0,max:112})}${field('study'+p,'Study hours / week',{type:'number',min:0,max:112})}${field('care'+p,'Care and household work hours / week',{type:'number',min:0,max:112})}${field('commute'+p,'Travel hours / week',{type:'number',min:0,max:112})}${field('other'+p,'Personal care and other commitments / week',{type:'number',min:0,max:112})}</div>`).join('')}</div><div id="timeStats">${timeStats()}</div>${field('workPlan','Schedule pattern',{options:['Overlapping day shifts','Staggered shifts','One adult in paid work','Variable or changing shifts','Other arrangement']})}${field('carePlan','Care coverage and backup',{type:'textarea',min:30,hint:'Describe who cares for the child during work/study hours and where coverage is uncertain.'})}${conceptPanel(['Role conflict','Unpaid care work','Structural constraint'])}`)+quiz(2)+footer(2);}
function budgetFeedback(){let t=totals();return `<div class="feedback ${t.balance<0?'warm':''}"><b>${t.balance<0?'There is a monthly shortfall.':'There is a planned monthly surplus.'}</b> ${money(Math.abs(t.balance))} ${t.balance<0?'is not yet covered. A zero balance is not required to complete the activity.':'remains after all planned outflows, including savings.'} This is a scenario calculation, not an affordability judgment.</div>`;}
function timeLeft(p){return 168-56-['paid','study','care','commute','other'].reduce((s,k)=>s+num(k+p),0);}
function timeStats(){return `<div class="grid2">${['A','B'].map(p=>`<p><b class="${timeLeft(p)<0?'negative':'mark'}">${qty(timeLeft(p))} hours</b> unallocated for Adult ${p==='A'?1:2} after sleep and entered commitments.</p>`).join('')}</div><p class="hint">A negative value means the schedule exceeds available hours; identify the gap rather than pretending all tasks fit.</p>`;}
const LOVE=['Companionate closeness and commitment','Passionate attraction','Developing intimacy and commitment','Course-specific framework'];
const PARENT=['Authoritative','Authoritarian','Permissive','Uninvolved','Mixed or changing pattern'];
function relationships(){return intro(3,'How do we live?','Practice an ordinary disagreement, examine each adult’s approach, and agree on how to share responsibilities.')+section('Two adults, two perspectives',`<p>Use the course’s framework where it differs from these practice labels. Patterns are context-dependent, not diagnoses or fixed identities.</p><div class="grid2">${['a','b'].map((p,i)=>`<div><h3>${esc(val(p+'Name')||'Adult '+(i+1))}</h3>${field(p+'Love','Love or closeness pattern',{options:LOVE})}${field(p+'Communication','Usual communication approach',{options:['Direct expression with listening','Avoiding difficult conversations','Focusing quickly on solutions','Seeking reassurance','Course-specific approach']})}${field(p+'Parenting','Parenting pattern',{options:PARENT})}${field(p+'StyleExample','Explain and illustrate these patterns',{type:'textarea',min:35,rows:4,hint:'Use one or more specific examples; distinguish your observations from assumptions.'})}</div>`).join('')}</div>${field('lifestyle','Daily life, values, and shared activities',{type:'textarea',min:25,hint:'How do interests, cultural practices, beliefs, time, and budget shape everyday life? No identity determines a lifestyle.'})}${conceptPanel(['Companionate love','Authoritative parenting','Authoritarian parenting','Permissive parenting','Uninvolved parenting'])}`)+section('Rehearse a conversation',`<p class="quote">“You never notice what needs doing. I am always the one arranging pickup.”</p><p class="hint">This is a fictional prompt for practice, not a diagnosis. It may describe criticism and a real concern about unequal planning work.</p>${field('conversationPrediction','Before choosing a reply, predict what could happen',{type:'textarea',min:25,hint:'Name a communication pattern and predict a possible response. Minimum 25 characters.'})}${options('reply',[
['defend','Defend and counter-blame','“I work hard too. You always make me the problem.”'],['pause','Take a planned pause','“I want to work this out. Can we pause for 20 minutes and return at 7?”'],['listen','Listen and make it specific','“You are carrying the planning work. Which days need coverage, and how can we divide it?”']])}<button class="primary small" data-action="conversation" style="margin-top:14px">Try this response</button>${state.conversation?`<div class="feedback"><b>One possible response</b><p>${esc(state.conversation.response)}</p><p>${esc(state.conversation.explanation)}</p><p class="hint">This branch is prewritten and illustrative. Real responses vary. Retrying explores an alternative; it does not erase your first prediction.</p></div>`:''}${field('repair','Write a revised response in your own words',{type:'textarea',min:25,hint:'Name a specific concern, show understanding, and propose a feasible next step.'})}${field('relationshipReflect','Explain why your revision might help and one limit',{type:'textarea',min:30,hint:'Use a communication or conflict concept. Separate the pattern from the person.'})}${conceptPanel(['Criticism','Contempt','Defensiveness','Stonewalling','Active listening'])}`)+section('Your relationship agreement',`<p>Write four commitments: who does what, when, and how the family revisits it. This is an educational agreement, not a legal contract.</p>${field('agreementMoney','1 · Money decisions',{type:'textarea',min:20,rows:2})}${field('agreementCare','2 · Care and household responsibilities',{type:'textarea',min:20,rows:2})}${field('agreementTalk','3 · Communication and disagreement',{type:'textarea',min:20,rows:2})}${field('agreementTime','4 · Shared time and review date',{type:'textarea',min:20,rows:2})}`)+quiz(3)+footer(3);}
const EVENTS={care:{title:'Three days without childcare',desc:'The usual care arrangement is unavailable for three workdays. Keep the family’s jobs and household members unchanged. Explore how time and money interact.',choices:[{id:'cover',title:'Pay for temporary care',desc:'Illustrative cost: $180 once. No modeled loss of wages.',cost:180,lost:0,hours:0,lesson:'Paying may protect work hours but reduces cash. In real planning, availability, suitability, and price must be checked.'},{id:'leave',title:'One adult takes unpaid time',desc:'Illustrative take-home income loss: $150 once, plus 18 hours of care.',cost:0,lost:150,hours:18,lesson:'An apparent saving on childcare shifts costs to lost income and unpaid time. Whether leave is available is an assumption.'},{id:'network',title:'Ask an established support person',desc:'Illustrative transport and food: $40 once. The supporter provides 18 hours.',cost:40,lost:0,hours:0,lesson:'Help can protect income, but someone else contributes time. Explain whether your established support network can realistically do this.'}]},transport:{title:'Two days without usual transport',desc:'The family’s usual way to reach work and care is unavailable for two days. This applies whether the usual mode is a car or transit.',choices:[{id:'rides',title:'Arrange temporary rides',desc:'Illustrative cost: $80 once; no modeled wage loss.',cost:80,lost:0,hours:2,lesson:'Paying preserves some time, but access and reliability are not guaranteed.'},{id:'reroute',title:'Use a slower alternative route',desc:'Illustrative cost: $20 once; 6 extra travel hours.',cost:20,lost:0,hours:6,lesson:'A cheaper route can create time conflicts with care and work. Money is only one resource.'},{id:'miss',title:'Miss one work period',desc:'Illustrative take-home income loss: $90 once.',cost:0,lost:90,hours:0,lesson:'Missing work may solve an immediate trip problem while threatening cash and job security. Employment consequences are not quantified here.'}]}};
function eventOption(){let e=EVENTS[val('event')]||EVENTS.care;return e.choices.find(o=>o.id===val('eventChoice'));}
function eventNumbers(){if(!state.eventRun)return null;let r=state.eventRun;return{after:totals().balance-r.cost-r.lost,cashAfter:num('cash')+totals().balance-r.cost-r.lost,change:-(r.cost+r.lost)};}
function eventResult(){let r=state.eventRun;if(!r)return '';let n=eventNumbers();return `<div class="feedback"><b>Illustrative consequences · one affected month</b><div class="stats"><div class="stat"><span>One-time cash / income effect</span><strong>${money(n.change)}</strong></div><div class="stat"><span>Affected month balance</span><strong class="${n.after<0?'negative':'positive'}">${money(n.after)}</strong></div><div class="stat"><span>Starting cash + month balance</span><strong class="${n.cashAfter<0?'negative':'positive'}">${money(n.cashAfter)}</strong></div></div><p>${esc(r.lesson)}</p><p>${r.hours} additional household hours in the affected week. This does not change the baseline weekly schedule automatically. ${r.choice==='network'?'The supporter contributes 18 hours separately.':''}</p><p class="hint">The result is recalculated from your current baseline. Each event is applied once; retrying replaces the active choice. Savings contributions are treated as outflow to a separate pot. Negative ending cash represents an unmet funding need, not an approved loan.</p></div>`;}
function challenges(){let e=EVENTS[val('event')]||EVENTS.care;return intro(4,'What issues arise?','Predict a response, experience a transparent scenario, and compare the costs borne by different people.')+section('Choose one event',options('event',[['care','Childcare interruption','Three workdays without the usual care arrangement.'],['transport','Transport interruption','Two days without the usual way to get around.']])+`<h3>${e.title}</h3><p>${e.desc}</p><p class="notice">All event amounts below are fictional teaching assumptions. You can complete this activity without making your budget balance. The purpose is to explain constraints and tradeoffs.</p>`)+section('Predict before you see the outcome',`${state.eventRun?`<p class="hint">Recorded initial prediction: ${esc(state.eventRun.prediction)}</p>`:field('eventPrediction','What would your family do, and what might follow?',{type:'textarea',min:30,hint:'Predict one financial consequence and one relationship or time consequence. Minimum 30 characters.'})}${options('eventChoice',e.choices.map(o=>[o.id,o.title,o.desc]))}<button class="primary small" data-action="runEvent" style="margin-top:14px">${state.eventRun?'Compare this option':'Reveal consequences'}</button><div id="eventResult">${eventResult()}</div>${state.eventHistory.length?`<details><summary>Your scenario comparisons (${state.eventHistory.length})</summary>${state.eventHistory.map(r=>`<p>${esc(r.title)} · ${esc(r.option)} · one-time effect ${money(-r.cost-r.lost)} · ${r.hours} extra household hours.</p>`).join('')}</details>`:''}`)+section('Interpret the pressures',`${field('eventReason','Why choose this response over an alternative?',{type:'textarea',min:30,hint:'Use the displayed numbers and explain feasibility. If you choose network support, identify the established supporter and availability.'})}${field('structural','What structural influence shapes the options?',{type:'textarea',min:30,hint:'For example, employer leave, transport routes, childcare availability, discrimination, or access to support. Do not assume hardship from identity.'})}${field('burden','Who bears the time, money, or emotional burden?',{type:'textarea',min:30})}${field('resourcePlan','What support or institutional change would help?',{type:'textarea',min:30,hint:'Distinguish a source to investigate from a benefit or service you have verified. Income alone does not establish eligibility.'})}${conceptPanel(['Structural constraint','Role conflict','Social support','Unpaid care work'])}`)+quiz(4)+footer(4);}
function theories(){return intro(5,'How do we compare?','Use theory to explain a pattern in your family. A theory gives you a perspective, not a verdict.')+section('Choose your analytical lens',field('theory','Main perspective',{options:Object.keys(THEORIES)})+(THEORIES[val('theory')]?`<div class="feedback"><b>${esc(val('theory'))}</b><p>${esc(THEORIES[val('theory')].def)}</p><p>${esc(THEORIES[val('theory')].ask)}</p></div>`:'')+`${field('theoryDefinition','Define this perspective in your own words',{type:'textarea',min:25,hint:'Use your course materials; include the source below.'})}${field('theorySource','Course source, chapter/page, or source URL')}${field('theoryExample1','Application 1 — explain a family decision',{type:'textarea',min:35,hint:'Identify the case detail, connect it to the theory, and explain what that connection reveals.'})}${field('theoryExample2','Application 2 — explain another pattern',{type:'textarea',min:35,hint:'Choose a different detail from money, care, communication, work, or support.'})}${field('alternative','A different perspective',{options:Object.keys(THEORIES)})}${field('theoryLimit','What would the other perspective notice? What does your first lens miss?',{type:'textarea',min:35})}`)+section('Keep an evidence trail',`<p>Record three claims and their sources or clearly labeled scenario assumptions. A source can be a course reading, a primary source you read, or this simulation for a fictional number. Labels alone do not verify a claim.</p>${state.sources.map((r,i)=>`<div class="sourceRow"><h3>Evidence record ${i+1}</h3><label class="field"><span>Claim or concept</span><input data-source="${i}" data-part="claim" maxlength="500" value="${esc(r.claim)}"></label><label class="field"><span>Source and what it supports</span><textarea data-source="${i}" data-part="source" maxlength="1500">${esc(r.source)}</textarea></label><label class="field"><span>Date checked</span><input type="date" data-source="${i}" data-part="date" value="${esc(r.date)}"></label></div>`).join('')}<p class="hint">Unlike a source citation, an AI answer is not evidence about prices or family behavior. Check what the original source actually supports.</p>`)+quiz(5)+footer(5);}
function futureStats(){let t=totals(),net=num('futureIncome')-num('futureDeductions'),spend=Math.max(0,t.spend+num('futureCostChange'));return `<div class="grid2"><div class="stat"><span>Current monthly balance</span><strong class="${t.balance<0?'negative':'positive'}">${money(t.balance)}</strong></div><div class="stat"><span>Possible future monthly balance</span><strong class="${net-spend<0?'negative':'positive'}">${money(net-spend)}</strong></div></div><p class="hint">Future = entered gross income − entered deductions − (current outflow + cost change). This is an assumption-based comparison, not a forecast; it excludes the one-time event.</p>`;}
function futures(){return intro(6,'How will we survive and thrive?','Explore two possible futures, connect them to concepts, and make a plan that can change when circumstances change.')+section('A possible future budget',`<p>Try a realistic change in the scenario. More income may require study, care, or travel; do not assume those costs disappear.</p><div class="grid3">${field('futureIncome','Future combined gross / month ($)',{type:'number',min:0,max:200000})}${field('futureDeductions','Future deductions / month ($)',{type:'number',min:0,max:200000})}${field('futureCostChange','Change in monthly outflow ($)',{type:'number',min:-100000,max:100000,hint:'Negative reduces costs; positive increases them.'})}</div><div id="futureStats">${futureStats()}</div>${field('futureAssumptions','What would have to be true for these figures to work?',{type:'textarea',min:30,hint:'Explain the source or assumption behind changes in income and expenses.'})}`)+section('Two paths, with uncertainty',`${field('pathA','Path A — if the plan works',{type:'textarea',min:30,hint:'Include a family strength, a relationship practice, and an external condition.'})}${field('pathB','Path B — if one important condition changes',{type:'textarea',min:30,hint:'Name the changed condition and explain a backup. Separation/co-parenting may be discussed if relevant; no outcome is inevitable.'})}<div class="grid3">${[1,2,3].map(i=>`<div>${field('futureConcept'+i,'Concept '+i,{options:Object.keys(CONCEPTS)})}${field('futureApply'+i,'Apply this concept to a future path',{type:'textarea',min:25,rows:4})}</div>`).join('')}</div>${field('learning','What changed in your thinking about families?',{type:'textarea',min:30,hint:'Compare an initial assumption with something you learned from a decision, calculation, or source.'})}`)+section('One next step',`<div class="grid2">${field('nextAction','A concrete action for this fictional family')}${field('owner','Who takes responsibility?')}${field('reviewDate','When will they review it?',{type:'date'})}${field('indicator','What evidence would show progress?')}</div>${field('backupPlan','What is the backup if this action is not feasible?',{type:'textarea',min:30})}${check('ownWork','I reviewed the report inputs, labeled outside assistance, and understand that completion does not certify independent mastery.')}${field('assistance','Brief assistance declaration',{type:'textarea',min:15,hint:'State tools or people used, their role, and what you verified. “I completed this without outside assistance” is acceptable if accurate.'})}${conceptPanel(['Resilience','Social support','Life course'])}`)+quiz(6)+footer(6);}
function completionReady(){return errorsFor(0).length===0&&[1,2,3,4,5,6].every(n=>state.completed[n]&&errorsFor(n).length===0);}
function portfolio(){let ready=completionReady(),missing=[1,2,3,4,5,6].filter(n=>!state.completed[n]||errorsFor(n).length);return `<span class="eyebrow">Your learning portfolio</span><h1>${ready?'Your family’s story, ready to share.':'Your portfolio is taking shape.'}</h1><p class="lead">Keep a record of your decisions, calculations, and explanations. Review your report before submitting it in Canvas.</p>${ready?`<div class="feedback"><b>All six chapters and learning checks are complete.</b> Completed ${esc(formatDate(state.completedAt))}. Your certificate documents local activity completion, not verified identity or independent mastery.</div>`:`<div class="feedback warm"><b>Draft portfolio.</b> Finish ${[...(errorsFor(0).length?['Welcome']:[]),...missing.map(n=>CHAPTERS[n])].join(', ')} to unlock the certificate. You can download drafts and planning tools now.</div>`}${stats()}<div class="grid2">${outputCard('Family summary report','Your six-section family narrative, budget and income breakdown, care plan, agreement, theory applications, future plan, and source records.','report',true)}${outputCard('Completion certificate','A dated, printable record of all chapters and checks completed. Includes a local record ID and an honest description of what was completed.','certificate',ready)}${outputCard('Planning worksheets','Budget review, weekly care schedule, relationship agreement, decision review, source checks, and a next-step worksheet. Includes your current plan plus space to revise it.','worksheets',true)}<div class="output"><h2>Budget spreadsheet data</h2><p>Download a CSV snapshot for Excel or Google Sheets, including income, deductions, expenses, event effects, and source notes. Values are a snapshot; spreadsheet formulas are not included.</p><button data-action="csv">Download budget CSV</button></div></div>`+section('Create a personal planning assistant prompt',`${field('promptMode','What should the assistant help with?',{options:['fictional','real-life planning']})}<p class="hint">“fictional” continues this case using your saved choices. “real-life planning” creates a privacy-conscious interview prompt without transferring the fictional family as your real situation. No chatbot is connected here.</p><div class="flex"><button data-action="preview" data-type="prompt">Preview prompt</button><button data-action="download" data-type="prompt">Download prompt TXT</button><button data-action="copyPrompt">Copy prompt</button></div>`)+section('Before you leave',`<ol><li>Preview and check your family summary, especially sources and assumptions.</li><li>Download the report and any required certificate or worksheets.</li><li>Upload the required files to your course assignment. This simulation does not submit anything to Canvas.</li><li>Save a JSON backup if you want to continue on another browser or device.</li></ol><div class="flex"><button class="primary" data-action="backup">Download progress backup</button><button data-action="nav" data-n="1">Review family details</button></div><p class="hint">Reports contain your entries. Share only what you intend others to read.</p>`);}
function outputCard(title,text,type,enabled){return `<div class="output"><h2>${title}</h2><p>${text}</p><div class="flex"><button data-action="preview" data-type="${type}" ${enabled?'':'disabled'}>Preview</button><button data-action="download" data-type="${type}" ${enabled?'':'disabled'}>Download HTML</button><button data-action="print" data-type="${type}" ${enabled?'':'disabled'}>Print / PDF</button></div></div>`;}
function render(focus=false){nav();document.getElementById('main').innerHTML=[home,family,budget,relationships,challenges,theories,futures,portfolio][state.step]();if(!storageOK)document.getElementById('saveStatus').textContent='Autosave unavailable — save a backup';if(focus){document.getElementById('main').focus();window.scrollTo({top:0,behavior:'instant'});}}
function textEnough(k,n=20){return String(val(k)).trim().length>=n;}
function errorsFor(n){let e=[],need=(k,label,min=20)=>{if(!textEnough(k,min))e.push(label);};if(n===0){need('learner','Enter a name or nickname.',1);if(!val('introRead'))e.push('Read and acknowledge the fictional-scenario guidance.');return e;}
if(n===1){need('familyName','Name your family or project.',1);need('location','Enter a location.',1);need('familyForm','Choose the adults’ relationship.',1);need('value','Choose a guiding value.',1);need('origin','Describe how the family came together.',20);['a','b','c'].forEach((p,i)=>{need(p+'Name',`Enter a name for ${i===2?'the child':'Adult '+(i+1)}.`,1);if(!Number.isInteger(num(p+'Age'))||num(p+'Age')<(i===2?0:18)||num(p+'Age')>(i===2?9:100))e.push('Use whole-number ages: adults 18–100; child 0–9.');need(p+'Bio',`Write a short biography for ${val(p+'Name')||'each person'}.`,30);});need('network','Explain your support network and limits.',25);need('familyReflect','Explain a link between history and a choice.',30);}
if(n===2){if(['incomeA','incomeB','deductions','cash'].some(k=>num(k)<0||num(k)>1000000))e.push('Income, deductions, and starting cash must be between 0 and 1,000,000.');['jobA','jobB'].forEach(k=>need(k,'Describe both adults’ work or study roles.',2));if(totals().gross<=0)e.push('Enter positive household gross income.');if(num('deductions')>totals().gross)e.push('Deductions cannot exceed gross income.');need('incomeBasis','Explain your income and deduction assumptions.',25);need('budgetReflect','Explain the budget tradeoff or shortfall.',30);need('carePlan','Describe care coverage and backup.',30);if(state.expenses.some(r=>!r.source.trim()))e.push('Give a source or explanation for every expense, including zero amounts.');for(let p of ['A','B'])if(['paid','study','care','commute','other'].some(k=>num(k+p)<0||num(k+p)>112))e.push('Weekly time inputs must be 0–112 hours.');}
if(n===3){['a','b'].forEach(p=>{['Love','Communication','Parenting'].forEach(k=>need(p+k,'Choose love, communication, and parenting patterns for both adults.',1));need(p+'StyleExample','Explain both adults’ patterns with examples.',35);});need('lifestyle','Describe daily life and shared activities.',25);if(!state.conversation)e.push('Try a conversation response.');need('repair','Write your own revised response.',25);need('relationshipReflect','Explain your revision and one limitation.',30);['Money','Care','Talk','Time'].forEach(k=>need('agreement'+k,'Complete all four agreement commitments.',20));}
if(n===4){if(!state.eventRun)e.push('Predict, choose a response, and reveal its consequences.');if(state.eventRun&&state.eventRun.choice!==val('eventChoice'))e.push('Reveal the consequences for your currently selected response.');['eventReason','structural','burden','resourcePlan'].forEach(k=>need(k,'Complete each explanation of the event, constraints, burdens, and support.',30));}
if(n===5){if(!THEORIES[val('theory')])e.push('Choose a main theory.');need('theoryDefinition','Define the theory in your own words.',25);need('theorySource','Identify the source for your definition.',5);['theoryExample1','theoryExample2','theoryLimit'].forEach(k=>need(k,'Complete two theory applications and an alternative interpretation.',35));if(!THEORIES[val('alternative')]||val('alternative')===val('theory'))e.push('Choose a different alternative perspective.');if(state.sources.some(r=>r.claim.trim().length<5||r.source.trim().length<10||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)))e.push('Complete all three evidence records and dates.');}
if(n===6){if(['futureIncome','futureDeductions'].some(k=>num(k)<0||num(k)>1000000))e.push('Future income and deductions must be between 0 and 1,000,000.');if(num('futureDeductions')>num('futureIncome'))e.push('Future deductions cannot exceed future gross income.');if(totals().spend+num('futureCostChange')<0)e.push('Future outflow cannot be negative.');['futureAssumptions','pathA','pathB','learning','backupPlan'].forEach(k=>need(k,'Explain the future assumptions, both paths, learning, and backup plan.',30));for(let i=1;i<=3;i++){if(!CONCEPTS[val('futureConcept'+i)])e.push('Choose three future concepts.');need('futureApply'+i,'Apply each future concept.',25);}if(new Set([1,2,3].map(i=>val('futureConcept'+i))).size<3)e.push('Choose three different concepts.');['nextAction','owner','indicator'].forEach(k=>need(k,'Complete the next action, owner, and progress indicator.',3));if(!/^\d{4}-\d{2}-\d{2}$/.test(String(val('reviewDate'))))e.push('Select a review date.');need('assistance','Add your assistance declaration.',15);if(!val('ownWork'))e.push('Review and acknowledge the completion statement.');}
if(!state.checks[n]?.passed)e.push('Complete the concept check correctly.');return [...new Set(e)];}
function showErrors(errors){let el=document.getElementById('errors');if(el){el.innerHTML=`<div class="errorlist"><b>A few things to finish</b><ul>${errors.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="mini">Length checks only confirm an entry is present; your instructor evaluates the quality of your reasoning.</p></div>`;el.scrollIntoView({behavior:'smooth',block:'center'});}else toast(errors.join(' '));}
function go(n){state.step=Math.max(0,Math.min(7,n));save();render(true);}

function updateLive(){if(document.getElementById('liveStats'))document.getElementById('liveStats').innerHTML=stats();if(document.getElementById('budgetFeedback'))document.getElementById('budgetFeedback').innerHTML=budgetFeedback();if(document.getElementById('grossNote'))document.getElementById('grossNote').textContent='Annual gross: '+money(totals().gross*12)+'. Net = gross − deductions.';if(document.getElementById('timeStats'))document.getElementById('timeStats').innerHTML=timeStats();if(document.getElementById('futureStats'))document.getElementById('futureStats').innerHTML=futureStats();}
function handleInput(ev){let el=ev.target;if(el.dataset.quiz){let n=+el.dataset.quiz;state.checks[n]={...(state.checks[n]||{}),selected:+el.value,passed:false,feedback:''};delete state.completed[n];invalidate();save();nav();return;}if(el.dataset.key){let k=el.dataset.key;if(el.tagName==='BUTTON')return;let v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?0:Number(el.value)):el.value;if(typeof v==='number'&&!Number.isFinite(v))return;state.data[k]=v;if(k!=='promptMode'){if(state.step>=1&&state.step<=6)delete state.completed[state.step];invalidate();}if(k==='reply')state.conversation=null;
if(el.tagName==='TEXTAREA') {
    let cnt = document.getElementById('cnt-'+k);
    if(cnt){
        let minMatch = cnt.innerText.match(/\/ (\d+)/);
        if(minMatch){
            let minLen = +minMatch[1];
            let len = el.value.trim().length;
            cnt.innerText = `${len} / ${minLen} chars min`;
            cnt.className = `char-counter ${len >= minLen ? 'met' : ''}`;
        }
    }
}
save();nav();updateLive();if(el.tagName==='SELECT'&&['theory','promptMode'].includes(k))render();return;}if(el.dataset.expense!==undefined){let i=+el.dataset.expense;let key=el.dataset.part;state.expenses[i][key]=key==='amount'?Math.max(0,Math.min(1000000,Number(el.value)||0)):el.value;delete state.completed[2];invalidate();save();nav();updateLive();}if(el.dataset.source!==undefined){state.sources[+el.dataset.source][el.dataset.part]=el.value;delete state.completed[5];invalidate();save();nav();}}

function report(){let t=totals(),r=state.eventRun,n=eventNumbers();return `<div class="document"><span class="eyebrow">Family Futures · learning portfolio</span><h1>${esc(val('familyName')||'Family summary')}</h1><p>Prepared by ${esc(val('learner')||'Learner')}${val('course')?' · '+esc(val('course')):''}<br>Exported ${esc(formatDate(new Date().toISOString()))}<br>Record ${esc(state.id)} · ${completionReady()?'All chapters complete':'Draft — some chapters are incomplete'}</p><p><b>Fictional case.</b> The narrative below consists of the learner’s entries and labeled simulation results. Illustrative costs are not current local prices. This document is not a verified assessment of mastery.</p><h2>1 · Who are we?</h2><p>${esc(val('familyForm'))} · ${esc(val('location'))} · Guiding value: ${esc(val('value'))}</p>${para('origin')}${['a','b','c'].map(p=>`<h3>${esc(val(p+'Name')||'Unnamed')} · age ${esc(val(p+'Age'))}</h3>${val(p+'Identity')?para(p+'Identity'):''}${para(p+'Bio')}`).join('')}<h3>Support and history</h3>${para('network')}${para('familyReflect')}<h2>2 · What do we do?</h2><p>Adult 1: ${esc(val('jobA'))}. Adult 2: ${esc(val('jobB'))}.</p>${para('incomeBasis')}${dataTable(['Income breakdown','Monthly USD'],[['Adult 1 gross',money(num('incomeA'))],['Adult 2 gross',money(num('incomeB'))],['Combined gross',money(t.gross)],['Deductions',money(num('deductions'))],['Combined net',money(t.net)]])}<p>Annual gross: ${money(t.gross*12)}. Starting emergency cash: ${money(num('cash'))}.</p>${dataTable(['Expense','Monthly USD','Evidence basis','Source or explanation'],state.expenses.map(e=>[e.label,money(e.amount),e.basis,e.source]))}${dataTable(['Budget totals','Monthly USD'],[['Total outflow including savings',money(t.spend)],['Balance before event',money(t.balance)]])}${para('budgetReflect')}<h3>Weekly time and care</h3>${dataTable(['Hours per week','Adult 1','Adult 2'],[['Sleep (scenario assumption)',56,56],...['paid','study','care','commute','other'].map((k,i)=>[['Paid work','Study','Care and household','Travel','Personal care and other'][i],num(k+'A'),num(k+'B')]),['Unallocated',qty(timeLeft('A')),qty(timeLeft('B'))]])}<p>Schedule: ${esc(val('workPlan'))}.</p>${para('carePlan')}<h2>3 · How do we live?</h2>${para('lifestyle')}${['a','b'].map(p=>`<h3>${esc(val(p+'Name'))}</h3><p>Love/closeness: ${esc(val(p+'Love'))}. Communication: ${esc(val(p+'Communication'))}. Parenting: ${esc(val(p+'Parenting'))}.</p>${para(p+'StyleExample')}`).join('')}<h3>Communication rehearsal</h3><p>Initial prediction: ${esc(val('conversationPrediction'))}</p>${state.conversation?`<p>Simulated response: ${esc(state.conversation.response)}</p>`:''}<p>My revised response: ${esc(val('repair'))}</p>${para('relationshipReflect')}<h3>Relationship agreement</h3>${['Money','Care','Talk','Time'].map((k,i)=>`<p><b>${['Money','Care and responsibilities','Communication','Shared time and review'][i]}:</b> ${esc(val('agreement'+k))}</p>`).join('')}<h2>4 · What issues do we have?</h2>${r?`<p>Event: ${esc(r.title)}. Selected response: ${esc(r.option)}.</p><p>Prediction recorded before outcome: ${esc(r.prediction)}</p>${dataTable(['Illustrative event effect','Value'],[['One-time spending',money(r.cost)],['One-time take-home income lost',money(r.lost)],['Additional household hours in affected week',r.hours],['Affected month balance',money(n.after)],['Starting emergency cash plus affected month balance',money(n.cashAfter)]])}<p>${esc(r.lesson)}</p>`:'<p>No event run yet.</p>'}${para('eventReason')}<h3>Structural influences and distribution of burdens</h3>${para('structural')}${para('burden')}${para('resourcePlan')}<h2>5 · How do we compare?</h2><h3>${esc(val('theory')||'Theory not selected')}</h3>${para('theoryDefinition')}<p>Course/source reference: ${esc(val('theorySource'))}</p><h3>Application one</h3>${para('theoryExample1')}<h3>Application two</h3>${para('theoryExample2')}<h3>Alternative perspective and limitation</h3><p>${esc(val('alternative'))}</p>${para('theoryLimit')}<h2>6 · How will we survive and thrive?</h2>${para('futureAssumptions')}<p>Future illustrative monthly gross ${money(num('futureIncome'))}, deductions ${money(num('futureDeductions'))}, outflow ${money(Math.max(0,t.spend+num('futureCostChange')))}, balance ${money(num('futureIncome')-num('futureDeductions')-Math.max(0,t.spend+num('futureCostChange')))}. One-time event excluded.</p><h3>Path A</h3>${para('pathA')}<h3>Path B</h3>${para('pathB')}${[1,2,3].map(i=>`<h3>${esc(val('futureConcept'+i)||'Concept '+i)}</h3>${para('futureApply'+i)}`).join('')}<h3>What I learned</h3>${para('learning')}<h3>Action plan</h3><p>Action: ${esc(val('nextAction'))}<br>Owner: ${esc(val('owner'))}<br>Review: ${esc(val('reviewDate'))}<br>Progress evidence: ${esc(val('indicator'))}</p>${para('backupPlan')}<h2>Evidence and assistance</h2>${dataTable(['Claim or concept','Source and support','Checked'],state.sources.map(s=>[s.claim,s.source,s.date]))}${para('assistance')}<h3>Learning check record</h3>${dataTable(['Chapter','Status','Attempts'],[1,2,3,4,5,6].map(i=>[CHAPTERS[i],state.checks[i]?.passed?'Correct after feedback if needed':'Incomplete',state.checks[i]?.attempts||0]))}<p>Completion checks verify that required entries are present and concept questions were answered. They do not automatically evaluate written reasoning or establish authorship. Your instructor may ask you to explain a decision under a changed condition.</p><h3>Activity sources and limits</h3><p>This six-section structure follows the supplied Family Creation assignment. The example paper informed organization only; its dated costs and theoretical claims were not treated as authoritative. Definitions are short teaching summaries; use your course material for formal analysis.</p>${resourcesHTML()}</div>`;}

function worksheets(){let t=totals();return `<div class="document"><h1>Family Planning Worksheets</h1><p>${esc(val('learner'))} · ${esc(val('familyName'))} · ${esc(formatDate(new Date().toISOString()))}</p><p>Use these to revisit your fictional plan. For real planning, replace scenario values with verified information and avoid sharing sensitive records.</p><h2>1 · Budget review</h2>${dataTable(['Category','Current monthly amount','Revised amount','Source / date'],state.expenses.map(r=>[r.label,money(r.amount),'','']))}<p>Gross ${money(t.gross)} − deductions ${money(num('deductions'))} = net ${money(t.net)}. Net − outflow ${money(t.spend)} = balance ${money(t.balance)}.</p><p>What needs verification? Which costs are recurring, one-time, or missing?</p><div class="worksheetline"></div><h2>2 · Weekly care and task plan</h2><p>Current arrangement: ${esc(val('carePlan'))}</p>${dataTable(['Day','Care coverage and time','Owner / backup','Work or study conflict'],['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(day=>[day,'','','']))}<p>Who handles planning, reminders, transport, and emotional support?</p><div class="worksheetline"></div><h2>3 · Relationship agreement review</h2>${['Money','Care','Talk','Time'].map((k,i)=>`<h3>${['Money decisions','Care and household work','Communication','Shared time'][i]}</h3><p>Current commitment: ${esc(val('agreement'+k))}</p><p>Revised commitment · owner · review date:</p><div class="worksheetline"></div>`).join('')}<h2>4 · Decision and source check</h2><p>Decision to make:</p><div class="worksheetline"></div>${dataTable(['Option','Money cost','Time cost','Who bears the burden','Assumptions to verify'],[['A','','','',''],['B','','','',''],['C','','','','']])}<p>Which course concept helps explain the options? What institutional condition could change them?</p><div class="worksheetline"></div>${dataTable(['Claim','Original source','Date / conditions','What changed after checking'],[['','','',''],['','','',''],
